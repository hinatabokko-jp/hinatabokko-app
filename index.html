<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--bg:#0f1219;--panel:#181d28;--panel-light:#222836;--border:#323b4e;--text:#f5f7fa;--sub:#9da6b5;--accent:#657dff;--success:#4cd964;--danger:#ff3b30}
html,body{width:100%;margin:0;padding:0;background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(101,125,255,.15),transparent 50%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;display:flex;justify-content:center;overflow-x:hidden}
button{font:inherit;outline:none}
.app{width:min(760px,100%);padding:16px}
header{text-align:center;margin-bottom:16px}
.title{margin:0;font-size:clamp(22px,5vw,32px);font-weight:900;letter-spacing:.04em;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{margin-top:4px;color:var(--sub);font-size:13px}
.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.section-card{background:var(--panel-light);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.section-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.section-card:active{transform:scale(.98)}
.section-card-title{font-size:16px;font-weight:800;margin-bottom:4px}
.section-card-sub{font-size:12px;color:var(--sub)}
.card{background:rgba(24,29,40,.95);border:1px solid var(--border);border-radius:20px;padding:clamp(16px,3.5vw,24px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.progress{color:var(--sub);font-size:14px}.progress strong{color:var(--accent);font-size:20px}
.badge-group{display:flex;gap:8px}.badge{color:var(--sub);font-size:12px;background:var(--panel-light);border:1px solid var(--border);padding:4px 10px;border-radius:20px}
.question-label{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.15em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.audio-btn,.tool-btn{background:var(--panel-light);border:1px solid var(--border);color:var(--text);border-radius:10px;cursor:pointer}
.audio-btn{padding:4px 10px;font-size:12px}.tool-btn{padding:8px 14px;font-size:13px;font-weight:600}
.question{text-align:center;font-size:clamp(20px,4.5vw,28px);line-height:1.8;font-weight:700;min-height:80px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:rgba(15,18,25,.5);border-radius:12px;border:1px solid rgba(255,255,255,.05)}
.reading{color:#a5b4fc;font-weight:700;white-space:nowrap}
.question-note{text-align:center;color:var(--sub);font-size:12px;margin-top:8px}
.section-title{margin:20px 0 10px;color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.05em;text-align:center}

.writing-container {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  width: 100%;
}

/* モバイル（標準）: 縦並び (column) */
.writing-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex: 1;
  width: 100%;
}

/* PCブラウザ・タブレット等（幅520px以上）: 横並び (row) へ変更 */
@media (min-width: 520px) {
  .writing-area {
    flex-direction: row;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    gap: 20px;
  }
}

/* スクロール補助用サイドバー */
.scroll-sidebar {
  width: 40px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px dashed rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  color: var(--sub);
  font-size: 11px;
  text-align: center;
  writing-mode: vertical-rl;
  letter-spacing: 0.15em;
  pointer-events: auto;
  touch-action: pan-y;
  flex-shrink: 0;
}
.scroll-sidebar span {
  margin: 4px 0;
  opacity: 0.7;
}

/* 手書き用の四角枠 */
.writing-box {
  position: relative;
  width: min(72vw, 210px);
  aspect-ratio: 1;
  background: #fff;
  border: 3px solid #3b4558;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
  touch-action: none;
  flex-shrink: 0;
}

/* PC画面の横並び時に大きさを自動最適化 */
@media (min-width: 520px) {
  .writing-box {
    width: min(35vw, 210px);
  }
}

.box-number {
  position: absolute;
  top: 6px;
  left: 8px;
  font-size: 12px;
  font-weight: 800;
  color: #3b4558;
  pointer-events: none;
  z-index: 3;
  background: rgba(230, 235, 245, .95);
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid rgba(59, 69, 88, 0.2);
}
.writing-box:before, .writing-box:after {
  content: "";
  position: absolute;
  pointer-events: none;
  z-index: 1;
}
.writing-box:before {
  left: 0; right: 0; top: 50%;
  border-top: 1px dashed rgba(100, 110, 130, .35);
}
.writing-box:after {
  top: 0; bottom: 0; left: 50%;
  border-left: 1px dashed rgba(100, 110, 130, .35);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 2;
  cursor: crosshair;
  touch-action: none;
}

.canvas-tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.buttons{display:grid;gap:10px;margin-top:16px}
.btn{width:100%;min-height:50px;border:0;border-radius:12px;padding:10px 16px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:.1s;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-check{background:linear-gradient(135deg,#5b6eff,#8b5cf6);box-shadow:0 4px 15px rgba(91,110,255,.3)}
.btn-next{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.btn-finish{background:transparent;border:1px solid #3b4351;color:#aeb7c5;min-height:42px;font-size:14px}
.answer-section{margin-top:20px}.answer-box{min-height:70px;background:#10141b;border:1px solid var(--border);border-radius:12px;display:flex;justify-content:center;align-items:center;padding:12px}
.answer-placeholder{color:#657080;font-size:13px;text-align:center}.answer{display:none;color:#fff;font-family:"Noto Serif JP","Yu Mincho",serif;font-size:clamp(32px,7vw,44px);font-weight:700;letter-spacing:.2em}
.answer.show{display:block}
.self-grading{display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:10px}.self-grading.show{display:grid}
.btn-correct{background:rgba(94,214,160,.15);border:2px solid var(--success);color:var(--success)}
.btn-incorrect{background:rgba(255,59,48,.15);border:2px solid var(--danger);color:var(--danger)}
.btn-correct.selected{background:var(--success);color:#000}.btn-incorrect.selected{background:var(--danger);color:#fff}
.result{display:none;text-align:center;padding:30px 10px}.result.show{display:block}
.result-icon{font-size:54px}.result-score{font-size:42px;font-weight:900;color:var(--accent);margin:10px 0}.result-title{font-size:26px;font-weight:900}.result-message{margin-top:10px;color:var(--sub);line-height:1.8;font-size:14px}
.footer{text-align:center;color:#525b69;font-size:11px;margin-top:16px}
@media(max-width:480px){
  .app{padding:10px}
  .card{padding:14px;border-radius:16px}
}
</style>
</head>

</section>
</main>
<div class="footer">漢字テスト・手書き練習アプリ（１）</div>
</div>

{type:1,words:[{kanji:"属",reading:"ぞく"}],sentence:"どの グループに {0}するか 考える。"},
{type:1,words:[{kanji:"識",reading:"しき"}],sentence:"正しい {0}を 身につける。"},
{type:1,words:[{kanji:"因",reading:"いん"}],sentence:"事故の {0}を 調べる。"},
{type:1,words:[{kanji:"留",reading:"と"}],sentence:"心に {0}めておく。"},
{type:1,words:[{kanji:"現",reading:"あらわ"}],sentence:"気持ちを {0}す。"},
{type:1,words:[{kanji:"接",reading:"せつ"}],sentence:"人に {0}する。"},
{type:1,words:[{kanji:"応",reading:"こた"}],sentence:"質問に {0}える。"},
{type:1,words:[{kanji:"勢",reading:"いきお"}],sentence:"すごい {0}いで 走る。"},
{type:1,words:[{kanji:"河",reading:"かわ"}],sentence:"大きな {0}を 渡る。"},
{type:1,words:[{kanji:"史",reading:"し"}],sentence:"日本の {0}を 学ぶ。"},
{type:1,words:[{kanji:"招",reading:"まね"}],sentence:"友達を {0}く。"},
{type:1,words:[{kanji:"句",reading:"く"}],sentence:"好きな {0}を 書く。"},
{type:1,words:[{kanji:"序",reading:"じょ"}],sentence:"文章の {0}を 考える。"},
{type:1,words:[{kanji:"士",reading:"し"}],sentence:"武{0}が 活躍する。"},
{type:1,words:[{kanji:"資",reading:"し"}],sentence:"大切な {0}料を 集める。"}
];

let questions=[],currentSectionIndex=0,currentIndex=0,answered=false,correctCount=0,userGraded=false;
let canvases=[],ctxs=[],strokes=[],currentStroke=null,currentCanvasIndex=-1,drawing=false;

const BASE_CHAPTER = 1;
const BASE_QUESTION = 1;

const $=id=>document.getElementById(id);
const sectionSelectArea=$("sectionSelectArea"),sectionGrid=$("sectionGrid"),mainCard=$("mainCard"),headerSubtitle=$("headerSubtitle"),sectionLabelText=$("sectionLabelText");
const questionEl=$("question"),currentNumberEl=$("currentNumber"),totalNumberEl=$("totalNumber"),questionTypeEl=$("questionType"),correctCountEl=$("correctCount"),writingArea=$("writingArea");
const clearBtn=$("clearBtn"),undoBtn=$("undoBtn"),checkBtn=$("checkBtn"),nextBtn=$("nextBtn"),finishBtn=$("finishBtn"),audioBtn=$("audioBtn");
const answer=$("answer"),answerPlaceholder=$("answerPlaceholder"),selfGrading=$("selfGrading"),correctBtn=$("correctBtn"),incorrectBtn=$("incorrectBtn");
const testArea=$("testArea"),resultArea=$("resultArea"),restartBtn=$("restartBtn"),backToMenuBtn=$("backToMenuBtn"),finalScore=$("finalScore");

let audioCtx = null;
function initAudio() {
  if(!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(AudioContextClass) audioCtx = new AudioContextClass();
  }
  if(audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function scrollToTop() {
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){}
}

function playSound(type){
 try {
    initAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;

    if(type==="tap"){
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(600,now);
      gain.gain.setValueAtTime(.05,now);
      gain.gain.exponentialRampToValueAtTime(.01,now+.05);
      osc.start(now);osc.stop(now+.05);
    }else if(type==="correct"){
      const voices = [
        { startF: 520,  endF: 1050, delay: 0.00, dur: 0.55 },
        { startF: 660,  endF: 1320, delay: 0.04, dur: 0.50 },
        { startF: 780,  endF: 1560, delay: 0.08, dur: 0.52 },
        { startF: 880,  endF: 1760, delay: 0.12, dur: 0.48 }
      ];
      voices.forEach(v => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        const t = now + v.delay;
        osc.frequency.setValueAtTime(v.startF, t);
        osc.frequency.exponentialRampToValueAtTime(v.endF, t + 0.18);
        osc.frequency.linearRampToValueAtTime(v.endF * 0.95, t + v.dur);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, t + v.dur);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start(t);osc.stop(t + v.dur);
      });
      const arpeggio = [
        { f: 523.25, t: 0.00 },
        { f: 659.25, t: 0.07 },
        { f: 783.99, t: 0.14 },
        { f: 1046.50, t: 0.21 },
        { f: 1318.51, t: 0.28 }
      ];
      arpeggio.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.18, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.35);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start(now + n.t);osc.stop(now + n.t + 0.35);
      });
      const sparkles = [1567.98, 1760.00, 2093.00, 2349.32, 2637.02];
      sparkles.forEach((freq, idx) => {
        const t = now + 0.22 + idx * 0.04;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start(t);osc.stop(t + 0.15);
      });
    }else{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.type="sawtooth";
      osc.frequency.setValueAtTime(220,now);
      osc.frequency.setValueAtTime(180,now+.15);
      gain.gain.setValueAtTime(.1,now);
      gain.gain.exponentialRampToValueAtTime(.01,now+.3);
      osc.start(now);osc.stop(now+.3);
    }
 } catch(e) {}
}

function triggerConfetti(){
 try {
    if(typeof confetti==="function") confetti({particleCount:100,spread:80,origin:{y:.6}});
 } catch(e) {}
}

function initSectionMenu(){
 sectionGrid.innerHTML="";const size=10,total=Math.ceil(allQuestions.length/size);
 for(let i=0;i<total;i++){
  const chapterNum = BASE_CHAPTER + i;
  const startNum = BASE_QUESTION + i*size;
  const endNum = Math.min(BASE_QUESTION + (i+1)*size - 1, BASE_QUESTION + allQuestions.length - 1);
  
  const card=document.createElement("div");card.className="section-card";
  card.innerHTML=`<div class="section-card-title">第 ${chapterNum} 章</div><div class="section-card-sub">問 ${startNum} 〜 問 ${endNum} （${endNum-startNum+1}問）</div>`;
  card.addEventListener("click",()=>startSection(i));sectionGrid.appendChild(card);
 }
}

function startSection(i){
 playSound("tap");currentSectionIndex=i;const size=10,start=i*size,end=Math.min((i+1)*size,allQuestions.length);
 questions=allQuestions.slice(start,end);sectionSelectArea.classList.add("hidden");mainCard.classList.remove("hidden");testArea.classList.remove("hidden");resultArea.classList.remove("show");
 
 const chapterNum = BASE_CHAPTER + i;
 const startNum = BASE_QUESTION + start;
 const endNum = BASE_QUESTION + end - 1;

 headerSubtitle.textContent=`第 ${chapterNum} 章 （問 ${startNum} 〜 問 ${endNum}）`;
 sectionLabelText.textContent=`第 ${chapterNum} 章 - QUESTION`;
 currentIndex=0;correctCount=0;correctCountEl.textContent=0;showQuestion();
 scrollToTop();
}

function showMenu(){
 playSound("tap");
 mainCard.classList.add("hidden");
 sectionSelectArea.classList.remove("hidden");
 headerSubtitle.textContent="第１章 〜 第１０章（問１〜問１００）";
 scrollToTop();
}

function setupCanvas(cvs,ctx,index){
 if(!cvs) return;
 const rect=cvs.getBoundingClientRect();
 if(rect.width === 0 || rect.height === 0) return;
 
 const ratio=window.devicePixelRatio||1;
 cvs.width=rect.width*ratio;cvs.height=rect.height*ratio;
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.lineCap="round";ctx.lineJoin="round";
 ctx.lineWidth=Math.max(4,rect.width/30);
 ctx.strokeStyle="#1a1a1a";
 
 cvs.onpointerdown=e=>startDrawing(e,index);
 cvs.onpointermove=e=>draw(e,index);
 cvs.onpointerup=e=>stopDrawing(e,index);
 cvs.onpointercancel=e=>stopDrawing(e,index);
}

function buildWritingBoxes(count){
 writingArea.innerHTML="";canvases=[];ctxs=[];strokes=[];
 for(let i=0;i<count;i++){
  const box=document.createElement("div");box.className="writing-box";
  if(count>1){
    const label=document.createElement("div");
    label.className="box-number";
    label.textContent=`${i+1}文字目`;
    box.appendChild(label);
  }
  const cvs=document.createElement("canvas");
  box.appendChild(cvs);
  writingArea.appendChild(box);
  const ctx=cvs.getContext("2d");
  canvases.push(cvs);
  ctxs.push(ctx);
  
  setTimeout(()=>setupCanvas(cvs,ctx,i), 30);
  setTimeout(()=>setupCanvas(cvs,ctx,i), 150);
 }
}

function redrawAll(){
 canvases.forEach((cvs,idx)=>{
  const ctx=ctxs[idx],rect=cvs.getBoundingClientRect();
  if(!ctx || rect.width === 0) return;
  ctx.clearRect(0,0,rect.width,rect.height);
  strokes.filter(s=>s.canvasIndex===idx).forEach(s=>{
    if(!s.points.length)return;
    ctx.beginPath();
    ctx.moveTo(s.points[0].x,s.points[0].y);
    for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
    ctx.stroke();
  });
 });
}

function getPoint(e,cvs){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

function startDrawing(e,i){
 initAudio();
 const cvs=canvases[i];
 try { cvs.setPointerCapture(e.pointerId); } catch(_){}
 drawing=true;currentCanvasIndex=i;currentStroke={canvasIndex:i,points:[getPoint(e,cvs)]};
 strokes.push(currentStroke);redrawAll();
}

function draw(e,i){if(!drawing||currentCanvasIndex!==i)return;currentStroke.points.push(getPoint(e,canvases[i]));redrawAll()}

function stopDrawing(e,i){
 if(!drawing||currentCanvasIndex!==i)return;
 drawing=false;
 try{canvases[i].releasePointerCapture(e.pointerId)}catch(_){}
 currentCanvasIndex=-1;
}

function clearCanvas(){strokes=[];redrawAll()}
function undoLastStroke(){if(strokes.length){strokes.pop();redrawAll();playSound("tap")}}

function createQuestionHTML(item){let text=item.sentence;item.words.forEach((w,i)=>text=text.replace(`{${i}}`,`<span class="reading">（${w.reading||""}）</span>`));return text}

function speakQuestion(){
 if(!("speechSynthesis"in window))return;
 try {
    window.speechSynthesis.cancel();
    const item=questions[currentIndex];let t=item.sentence;
    item.words.forEach((w,i)=>t=t.replace(`{${i}}`,w.reading||""));
    const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.9;
    window.speechSynthesis.speak(u);
 } catch(e){}
}

function showQuestion(){
 const item=questions[currentIndex];currentNumberEl.textContent=currentIndex+1;totalNumberEl.textContent=questions.length;questionTypeEl.textContent=item.type===1?"1文字":"2文字";questionEl.innerHTML=createQuestionHTML(item);
 answered=false;userGraded=false;buildWritingBoxes(item.words.length);answer.textContent="";answer.classList.remove("show");answerPlaceholder.style.display="block";selfGrading.classList.remove("show");selfGrading.style.display="none";correctBtn.classList.remove("selected");incorrectBtn.classList.remove("selected");checkBtn.disabled=false;nextBtn.disabled=true;
}

function checkAnswer(){if(answered)return;playSound("tap");const item=questions[currentIndex];answer.textContent=item.words.map(w=>w.kanji).join(" ");answer.classList.add("show");answerPlaceholder.style.display="none";selfGrading.style.display="grid";answered=true;checkBtn.disabled=true;nextBtn.disabled=false}

function gradeAnswer(ok){
 playSound(ok?"correct":"incorrect");
 if(ok) triggerConfetti();
 if(!userGraded&&ok)correctCount++;else if(userGraded&&!ok&&correctCount>0)correctCount--;correctCountEl.textContent=correctCount;userGraded=true;
 if(ok){correctBtn.classList.add("selected");incorrectBtn.classList.remove("selected")}else{incorrectBtn.classList.add("selected");correctBtn.classList.remove("selected")}
 nextBtn.disabled=false;
}

function nextQuestion(){
 playSound("tap");
 currentIndex++;
 if(currentIndex>=questions.length){
   showResult();
   return;
 }
 showQuestion();
 scrollToTop();
}

function showResult(){
 testArea.classList.add("hidden");resultArea.classList.add("show");finalScore.textContent=`${correctCount} / ${questions.length}`;
 const ratio=correctCount/questions.length;let msg="よくがんばりました！";if(ratio===1){msg="素晴らしい！パーフェクト達成です！🎉";triggerConfetti()}else if(ratio>=.8)msg="高得点です！あと少しで満点！";else if(ratio>=.5)msg="ナイスファイト！繰り返し練習しよう！";$("resultMessage").innerHTML=msg;
 scrollToTop();
}

function restart(){ startSection(currentSectionIndex); }

clearBtn.onclick=()=>{playSound("tap");clearCanvas()};
undoBtn.onclick=undoLastStroke;
checkBtn.onclick=checkAnswer;
nextBtn.onclick=nextQuestion;
finishBtn.onclick=showMenu;
backToMenuBtn.onclick=showMenu;
restartBtn.onclick=restart;
audioBtn.onclick=speakQuestion;
correctBtn.onclick=()=>gradeAnswer(true);
incorrectBtn.onclick=()=>gradeAnswer(false);

const resizeHandler = ()=>{
 if(!mainCard.classList.contains("hidden")){
  canvases.forEach((c,i)=>setupCanvas(c,ctxs[i],i));
  redrawAll();
 }
};
window.addEventListener("resize", resizeHandler);

if(window.ResizeObserver){
 const ro = new ResizeObserver(()=>{ resizeHandler(); });
 ro.observe(document.body);
}

window.onload=initSectionMenu;
</script>
