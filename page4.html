    <style>

            background-color: #0f1117;
            color: #f3f4f6;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-image:

        }

        /* 和風の縦書き・美しいカードスタイル */
        .waka-card {
            background: linear-gradient(145deg, #1e222d, #161822);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover {
            border-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(217, 119, 6, 0.2);
        }

        /* スクロールバー非表示設定 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;

/* ハンバーガーボタンのスタイル (画面左上に固定) */
#hamburger-btn {
  position: fixed;
  top: 15px;
  left: 15px;
  width: 44px;
  height: 44px;
  background-color: #333;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

#hamburger-btn span {
  display: block;
  width: 24px;
  height: 3px;
  background-color: #fff;
  border-radius: 2px;
  transition: 0.3s;
}

/* 背景を暗くするオーバーレイ */
#sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.5);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
  z-index: 1001;
}

#sidebar-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* サイドバー本体のスタイル */
#sidebar {
  position: fixed;
  top: 0;
  left: -280px; /* 初期状態は画面外に隠す */
  width: 280px;
  height: 100vh;
  background-color: #ffffff;
  box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
  transition: left 0.3s ease;
  z-index: 1002;
  display: flex;
  flex-direction: column;
}

#sidebar.active {
  left: 0; /* 開いたときに画面左から出現 */
}

/* サイドバーヘッダー */
.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  border-bottom: 1px solid #eee;
  background-color: #f8f9fa;
}

.sidebar-header h2 {
  margin: 0;
  font-size: 1.2rem;
  color: #333;
}

#close-btn {
  background: none;
  border: none;
  font-size: 1.8rem;
  cursor: pointer;
  color: #666;
  line-height: 1;
}

/* メニューリスト */
.sidebar-links {
  list-style: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
}

.sidebar-links li {
  border-bottom: 1px solid #f0f0f0;
}

.sidebar-links a {
  display: block;
  padding: 16px 20px;
  color: #333;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  transition: background-color 0.2s, color 0.2s;
}

.sidebar-links a:hover {
  background-color: #f0f4f8;
  color: #0056b3;
}

<body class="min-h-screen flex flex-col justify-between selection:bg-jp-accent selection:text-white">
    <canvas id="confetti-canvas"></canvas>

    <!-- ヘッダー -->
    <header class="border-b border-jp-border bg-jp-card/60 backdrop-blur-md sticky top-0 z-30 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showSelectScreen()">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-jp-accent to-jp-gold flex items-center justify-center font-serif font-bold text-white shadow-lg">
                    百
                </div>
                <h1 class="text-xl font-serif font-bold tracking-wider text-white">百人一首</h1>
            </div>
            <div id="header-progress" class="hidden text-sm font-medium text-jp-subtext">
                第 <span id="current-q-num" class="text-jp-gold font-bold text-base">1</span> / 10 問
            </div>
        </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-4xl mx-auto">

            <section id="select-screen" class="space-y-6">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl sm:text-3xl font-serif font-bold text-white tracking-wide">
                        練習する句の選択
                    </h2>
                    <p class="text-jp-subtext text-sm sm:text-base">
                        取り組むグループを選択してください（1回10問）
                    </p>
                </div>

                <div id="group-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pt-4">
                    <!-- JSでグループボタンを動的生成 -->
                </div>
            </section>

            <section id="quiz-screen" class="hidden space-y-6">
                <!-- プログレスバー -->
                <div class="w-full bg-jp-border h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-jp-accent to-jp-gold h-full transition-all duration-300" style="width: 10%;"></div>
                </div>

                <!-- 問いと選択肢エリア -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    
                    <!-- 左側: kaminoku (問題カード) -->
                    <div class="lg:col-span-5 flex flex-col items-center">
                        <div class="w-full waka-card rounded-2xl p-6 sm:p-8 text-center relative overflow-hidden group border-l-4 border-l-jp-accent">

                            <div id="question-kaminoku" class="text-2xl sm:text-3xl font-serif font-bold text-white py-6 tracking-widest leading-relaxed">
                                <!-- kaminoku 表示 -->
                            </div>
                            <div class="text-xs text-jp-subtext mt-2 flex items-center justify-center gap-1">
                                <i class="fa-solid fa-circle-info"></i> 正しい下の句を選んでください
                            </div>
                        </div>
                    </div>

                    <!-- 右側/下側: shimonoku (選択肢カード 5枚) -->
                    <div class="lg:col-span-7 space-y-3">
                        <span class="text-xs uppercase tracking-widest text-jp-gold font-semibold mb-1 block px-1">下の句を選択 (shimonoku)</span>
                        <div id="options-container" class="space-y-3">
                            <!-- JSで選択肢ボタン5枚を動的生成 -->
                        </div>
                    </div>
                </div>

                <div id="answer-result-box" class="hidden waka-card rounded-2xl p-5 border border-jp-gold/40 bg-jp-card relative">
                    <div id="result-badge" class="mb-3 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold gap-1.5">
                        <!-- 正解/不正解バッジ -->
                    </div>

                    <!-- 指定フォーマットに従う解答表示コンテナ (スクロール/上下ボタンなしのシンプル構造) -->
                    <div class="w-full space-y-3 text-left">
                        <!-- 1行目: kaminoku & " " & 2banme & " " & 3banme (改行させず横幅確保) -->
                        <div class="w-full overflow-x-auto no-scrollbar py-1">
                            <p id="ans-line1" class="text-base sm:text-lg font-serif font-semibold text-jp-goldLight whitespace-nowrap">
                                <!-- 1行目表示 -->
                            </p>
                        </div>

                        <!-- 2行目: shimonoku & " " & 5banme -->
                        <div>
                            <p id="ans-line2" class="text-base sm:text-lg font-serif font-semibold text-white">
                                <!-- 2行目表示 -->
                            </p>
                        </div>

                        <!-- 3行目: kaisetu (1・2行目より小さめフォント、改行OK) -->
                        <div class="pt-2 border-t border-jp-border/60">
                            <p id="ans-line3" class="text-xs sm:text-sm text-jp-subtext leading-relaxed">
                                <!-- 解説表示 -->
                            </p>
                        </div>
                    </div>

                    <div class="mt-5 flex justify-end">
                        <button id="next-btn" onclick="nextQuestion()" class="px-6 py-2.5 bg-gradient-to-r from-jp-accent to-rose-700 hover:from-rose-600 hover:to-rose-800 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center gap-2">
                            <span>次の問題へ</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </div>
            </section>

            <section id="result-screen" class="hidden text-center space-y-6 max-w-lg mx-auto py-8">
                <div class="waka-card rounded-3xl p-8 space-y-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-jp-gold/10 border-2 border-jp-gold flex items-center justify-center text-jp-gold text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>

                    <div class="space-y-2">
                        <h2 class="text-2xl font-serif font-bold text-white">お疲れ様でした！</h2>
                        <p class="text-jp-subtext text-sm">今回の練習結果</p>
                    </div>

                    <div class="py-4 bg-jp-dark/50 rounded-2xl border border-jp-border">
                        <div class="text-4xl sm:text-5xl font-serif font-bold text-jp-gold">
                            <span id="score-num">0</span> <span class="text-lg font-normal text-jp-subtext">/ 10 問正解</span>
                        </div>
                    </div>

                    <div id="score-comment" class="text-sm font-medium text-jp-text">
                        <!-- 結果に応じたコメント -->
                    </div>

                    <div class="pt-2 flex flex-col sm:flex-row gap-3">
                        <button onclick="retryGroup()" class="flex-1 py-3 px-4 bg-jp-border hover:bg-slate-700 text-white font-bold rounded-xl transition">
                            もう一度挑戦
                        </button>
                        <button onclick="showSelectScreen()" class="flex-1 py-3 px-4 bg-gradient-to-r from-jp-accent to-rose-700 hover:from-rose-600 hover:to-rose-800 text-white font-bold rounded-xl transition">
                            句の選択に戻る
                        </button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- フッター -->
    <footer class="border-t border-jp-border/40 py-4 text-center text-xs text-jp-subtext">
        百人一首 練習アプリ
    </footer>

                    gainTri.connect(ctx.destination);

                    oscSine.start(startTime);
                    oscSine.stop(startTime + duration);
                    oscTri.start(startTime);
                    oscTri.stop(startTime + duration);
                });
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        // 不正解音（控えめな低音）
        function playIncorrectSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const startTime = ctx.currentTime;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, startTime); // A3
                osc.frequency.exponentialRampToValueAtTime(140, startTime + 0.25);
                
                gain.gain.setValueAtTime(0.15, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + 0.25);
            } catch(e) {}
        }

        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            particles = [];
            const colors = ['#e11d48', '#d97706', '#fef3c7', '#ffffff', '#fb7185', '#f59e0b'];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2 - 50,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }
            animateConfetti();
        }

        let animationId = null;
        function animateConfetti() {
            if (animationId) cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            let active = false;
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35; // 重力
                p.vx *= 0.98;
                p.rotation += p.rSpeed;
                p.opacity -= 0.012;

                if (p.opacity > 0) {
                    active = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.globalAlpha = Math.max(0, p.opacity);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                }
            });

            if (active) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        function initApp() {
            // データを10句ずつのグループ（セット）に分解
            groups = [];
            for (let i = 0; i < allWakaData.length; i += 10) {
                const chunk = allWakaData.slice(i, i + 10);
                const startNum = chunk[0].id;
                const endNum = chunk[chunk.length - 1].id;
                groups.push({
                    title: `第${startNum}首 ～ 第${endNum}首`,
                    data: chunk
                });
            }

            renderSelectScreen();
        }

        // 句選択画面の描画
        function renderSelectScreen() {
            const container = document.getElementById('group-list');
            container.innerHTML = '';

            groups.forEach((group, index) => {
                const btn = document.createElement('button');
                btn.className = `waka-card option-card p-5 rounded-2xl text-left border border-jp-border flex flex-col justify-between group`;
                btn.onclick = () => startQuizGroup(index);

                btn.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-jp-gold bg-jp-gold/10 border border-jp-gold/30 px-2.5 py-0.5 rounded-full">
                            グループ ${index + 1}
                        </span>
                        <i class="fa-solid fa-chevron-right text-jp-subtext group-hover:text-jp-gold transition-colors text-xs"></i>
                    </div>
                    <div class="text-lg font-serif font-bold text-white group-hover:text-jp-goldLight transition-colors">
                        ${group.title}
                    </div>
                    <div class="text-xs text-jp-subtext mt-3 pt-2 border-t border-jp-border/50">
                        10問演習
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // 各画面切り替え
        function showSelectScreen() {
            document.getElementById('select-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('header-progress').classList.add('hidden');
        }

        // クイズ開始
        function startQuizGroup(groupIndex) {
            currentGroupIndex = groupIndex;
            // 該当グループの10句を取得し、シャッフル
            currentQuizQueue = [...groups[groupIndex].data].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('header-progress').classList.remove('hidden');

            loadQuestion();
        }

        function retryGroup() {
            startQuizGroup(currentGroupIndex);
        }

        function loadQuestion() {
            answered = false;
            const currentWaka = currentQuizQueue[currentQuestionIndex];

            // プログレス更新
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            const progressPercent = ((currentQuestionIndex + 1) / 10) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // 問題（kaminoku）表示
            document.getElementById('question-kaminoku').textContent = currentWaka.kaminoku;

            // 選択肢（shimonoku 5枚）の作成
            // 正解 1つ + 全データからランダムダミー 4つ（被りなし）
            let dummyPool = allWakaData.filter(item => item.id !== currentWaka.id);
            dummyPool.sort(() => Math.random() - 0.5);
            
            let options = [currentWaka, ...dummyPool.slice(0, 4)];
            options.sort(() => Math.random() - 0.5); // 選択肢をランダムシャッフル

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = `w-full waka-card option-card p-4 sm:p-5 rounded-xl text-left border border-jp-border flex items-center justify-between transition-all duration-200 group`;
                optBtn.dataset.id = opt.id;
                optBtn.onclick = () => selectAnswer(opt, currentWaka, optBtn);

                optBtn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 rounded-full bg-jp-border/60 text-jp-subtext text-xs flex items-center justify-center font-bold group-hover:bg-jp-gold group-hover:text-black transition">
                            ${idx + 1}
                        </span>
                        <span class="text-base sm:text-lg font-serif font-semibold text-white tracking-wide">
                            ${opt.shimonoku}
                        </span>
                    </div>
                    <i class="fa-regular fa-circle text-jp-subtext/40 group-hover:text-jp-gold transition"></i>
                `;
                optionsContainer.appendChild(optBtn);
            });

            // 答え表示領域を隠す
            document.getElementById('answer-result-box').classList.add('hidden');
        }

        function selectAnswer(selectedWaka, correctWaka, clickedBtn) {
            if (answered) return;
            answered = true;

            const isCorrect = selectedWaka.id === correctWaka.id;

            // 全ボタンの有効化解除/ハイライト
            const optionButtons = document.querySelectorAll('#options-container button');
            optionButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('option-card');
                const btnId = parseInt(btn.dataset.id);
                if (btnId === correctWaka.id) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-950/40');
                    btn.querySelector('i').className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
                } else if (btn === clickedBtn && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-950/40');
                    btn.querySelector('i').className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            // 正解・不正解時の演出
            if (isCorrect) {
                score++;
                playToyPianoFanfare();
                launchConfetti();
            } else {
                playIncorrectSound();
            }

            // 答え（解説・全体句）の表示
            renderAnswerBox(isCorrect, correctWaka);
        }

        /*
           要件:
           1行目: kaminoku & " " & 2banme & " " & 3banme （改行しないよう横幅確保）
           2行目: shimonoku & " " & 5banme
           3行目: 1行目・2行目より小さめのフォントで kaisetu （改行可）
           スクロール/上下ボタン不要のシンプルなテキストボックス
        */
        function renderAnswerBox(isCorrect, waka) {
            const resultBox = document.getElementById('answer-result-box');
            const badge = document.getElementById('result-badge');

            if (isCorrect) {
                badge.className = "mb-3 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> 正解！`;
            } else {
                badge.className = "mb-3 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold gap-1.5 bg-rose-500/20 text-rose-400 border border-rose-500/30";
                badge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 残念...`;
            }

            // 1行目: kaminoku & " " & 2banme & " " & 3banme
            const line1Text = `${waka.kaminoku} ${waka.banme2} ${waka.banme3}`;
            document.getElementById('ans-line1').textContent = line1Text;

            // 2行目: shimonoku & " " & 5banme
            const line2Text = `${waka.shimonoku} ${waka.banme5}`;
            document.getElementById('ans-line2').textContent = line2Text;

            // 3行目: kaisetu
            document.getElementById('ans-line3').textContent = waka.kaisetu;

            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 次の問題または結果へ
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                loadQuestion();
            } else {
                showResultScreen();
            }
        }

        function showResultScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('header-progress').classList.add('hidden');

            document.getElementById('score-num').textContent = score;

            const commentEl = document.getElementById('score-comment');
            if (score === 10) {
                commentEl.textContent = "素晴らしい！全問正解です！完全にマスターしていますね。";
            } else if (score >= 7) {
                commentEl.textContent = "惜しい！あと少しで全問正解です。この調子で練習を続けましょう！";
            } else if (score >= 4) {
                commentEl.textContent = "よく頑張りました！何度も繰り返し練習して覚えていきましょう。";
            } else {
                commentEl.textContent = "焦らず少しずつ覚えていきましょう！繰り返し解くことが近道です。";
            }
        }

        // 起動時実行
        window.onload = function() {
            initApp();
        };
    </script>


<!-- ハンバーガーボタン（画面左上に固定表示） -->

  <span></span>

  <span></span>
</button>

    <h2>メニュー</h2>
    <button id="close-btn" aria-label="メニューを閉じる">&times;</button>

  </ul>
</nav>


<script>
  document.addEventListener('DOMContentLoaded', () => {
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    // サイドバーを開く関数
    function openSidebar() {
      sidebar.classList.add('active');
      overlay.classList.add('active');
    }

    // サイドバーを閉じる関数
    function closeSidebar() {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
    }

    // イベントリスナーの登録
    hamburgerBtn.addEventListener('click', openSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
  });
</script>
