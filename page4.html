                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4" id="set-buttons-container">
                    <!-- Dynamic set buttons will be rendered here -->
                </div>
            </div>

            <!-- QUIZ VIEW -->
            <div id="view-quiz" class="hidden space-y-6">
                <!-- Progress Bar & Status -->
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                    <div class="flex items-center gap-3 w-full md:w-auto">

                            第1句〜第10句

                        <span id="quiz-progress-text" class="text-slate-300 font-sans font-semibold text-sm">
                            問題 1 / 10
                        </span>

                </div>

                    <!-- Kaminoku Card (Left Side) -->
                    <div class="lg:col-span-5 w-full">

                        <div class="karuta-card rounded-2xl p-6 md:p-8 text-center min-h-[180px] md:min-h-[240px] flex flex-col justify-center items-center relative overflow-hidden group">

        /**
         * Web Audio API: トイピアノ風の短い正解ファンファーレ音
         * 音階: C5 -> E5 -> G5 -> C6 -> E6
         * 音色: サイン波 (Sine) + 三角波 (Triangle) の重ね合わせ
         */
        function playToyPianoFanfare() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();

                // Frequencies (Hz): C5, E5, G5, C6, E6
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                const noteInterval = 0.06;

                notes.forEach((freq, index) => {
                    const startTime = audioCtx.currentTime + (index * noteInterval);
                    const noteDuration = 0.4;

                    ['sine', 'triangle'].forEach((type) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, startTime);

                        const baseVol = (type === 'sine') ? 0.18 : 0.12;
                        gain.gain.setValueAtTime(0, startTime);
                        gain.gain.linearRampToValueAtTime(baseVol, startTime + 0.008);
                        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + noteDuration);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + noteDuration);
                    });
                });
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

            }
        }

        function showSetSelection() {
            document.getElementById('view-set-selection').classList.remove('hidden');
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('answer-modal').classList.add('hidden');
            document.getElementById('header-status').innerText = '100句を極める';
        }

        function startQuizSet(setIdx) {
            currentSetIndex = setIdx;
            const startNum = setIdx * 10;
            currentQuizQuestions = poems.slice(startNum, startNum + 10);
            
            // プレイしやすさのために問題順をランダムシャッフル
            currentQuizQuestions = shuffleArray([...currentQuizQuestions]);

            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('view-set-selection').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            document.getElementById('view-result').classList.add('hidden');

            document.getElementById('quiz-set-title').innerText = `第${setIdx * 10 + 1}句〜第${(setIdx + 1) * 10}句`;
            document.getElementById('header-status').innerText = `演習中 - 第${setIdx + 1}組`;

            loadQuestion();
        }

        function retryCurrentSet() {
            startQuizSet(currentSetIndex);
        }

        function loadQuestion() {
            currentPoem = currentQuizQuestions[currentQuestionIndex];

            // Progress Update
            const currentNum = currentQuestionIndex + 1;
            document.getElementById('quiz-progress-text').innerText = `問題 ${currentNum} / 10`;
            document.getElementById('quiz-progress-bar').style.width = `${(currentNum / 10) * 100}%`;

            // Display Kaminoku
            document.getElementById('kaminoku-display').innerText = currentPoem.kaminoku;

            // Prepare 5 Shimonoku options (1 correct + 4 random distractors)
            let distractors = poems.filter(p => p.id !== currentPoem.id);
            distractors = shuffleArray(distractors).slice(0, 4);

            let options = shuffleArray([currentPoem, ...distractors]);

            // Render Options
            const optionsContainer = document.getElementById('shimonoku-options-container');
            optionsContainer.innerHTML = '';

            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full karuta-card p-4 md:p-5 rounded-xl text-left flex items-center justify-between group transition-all cursor-pointer';
                btn.onclick = () => handleAnswerSelect(opt);

                btn.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <span class="w-7 h-7 rounded-lg bg-slate-800 text-amber-400 font-sans text-xs font-bold flex items-center justify-center border border-slate-700 shrink-0 group-hover:border-amber-400 group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors">
                            ${index + 1}
                        </span>
                        <span class="text-base md:text-xl font-bold text-slate-200 tracking-wider group-hover:text-amber-300 transition-colors">
                            ${opt.shimonoku}
                        </span>
                    </div>
                `;
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswerSelect(selectedPoem) {
            const isCorrect = (selectedPoem.id === currentPoem.id);

            if (isCorrect) {
                score++;
                playToyPianoFanfare();
                confetti({
                    particleCount: 75,
                    spread: 65,
                    origin: { y: 0.75 }
                });
            }

            showAnswerModal(isCorrect);
        }

        // 答えの表示（ku-zentai）
        // 1行目: kaminoku & " " & 2banme & " " & 3banme
        // 2行目: shimonoku & " " & 5banme
        function showAnswerModal(isCorrect) {
            const modal = document.getElementById('answer-modal');
            const header = document.getElementById('modal-result-header');

            if (isCorrect) {
                header.innerHTML = `
                    <span class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-lg">✓</span>
                    <span class="text-emerald-400">正解！</span>
                `;
            } else {
                header.innerHTML = `
                    <span class="w-9 h-9 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center justify-center text-lg">✕</span>
                    <span class="text-rose-400">不正解...</span>
                `;
            }

            // Construct Line 1 & Line 2
            const line1Text = `${currentPoem.kaminoku} ${currentPoem.banme2} ${currentPoem.banme3}`;
            const line2Text = `${currentPoem.shimonoku} ${currentPoem.banme5}`;

            document.getElementById('modal-line1').innerText = line1Text;
            document.getElementById('modal-line2').innerText = line2Text;

            const nextBtn = document.getElementById('modal-next-btn');
            if (currentQuestionIndex >= 9) {
                nextBtn.innerText = '結果を見る';
            } else {
                nextBtn.innerText = '次の問題へ';
            }

            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            document.getElementById('answer-modal').classList.add('hidden');
            currentQuestionIndex++;

            if (currentQuestionIndex < 10) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');

            document.getElementById('result-score-text').innerText = `${score} / 10`;

            let evalText = '';
            if (score === 10) {
                evalText = '完璧です！素晴らしい暗記力ですね。';
            } else if (score >= 7) {
                evalText = '素晴らしい成績です！あと少しで全問正解です。';
            } else if (score >= 4) {
                evalText = 'ナイスチャレンジ！繰り返し復習しましょう。';
            } else {
                evalText = '少しずつ覚えていきましょう！';
            }
            document.getElementById('result-evaluation').innerText = evalText;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
</body>
</html>
