<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>社会科トレーニング</title>
  
<!-- confetti.js for celebration effects -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", "Noto Sans JP", -apple-system, sans-serif;
  background: #10131a;
  color: #f2f4f8;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  touch-action: manipulation;
}

/* ========================================
   ハンバーガーメニュー
======================================== */

.menu-button {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1200;

  width: 48px;
  height: 48px;

  border: 1px solid #394252;
  border-radius: 14px;
  background: #191e27;
  color: #f2f4f8;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;

  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);

  transition: background .15s ease, transform .15s ease;
}

.menu-button:hover {
  background: #252c37;
}

.menu-button:active {
  transform: scale(.95);
}

.menu-button span {
  display: block;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: #f2f4f8;
  transition: transform .2s ease, opacity .2s ease;
}

/* メニューが開いているとき */
.menu-button.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.menu-button.open span:nth-child(2) {
  opacity: 0;
}

.menu-button.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* サイドバー */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1100;

  width: min(320px, 85vw);
  height: 100vh;

  background: #191e27;
  border-right: 1px solid #2d3442;

  padding: 84px 18px 24px;

  transform: translateX(-100%);
  transition: transform .25s ease;

  box-shadow: 18px 0 50px rgba(0,0,0,.45);
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-title {
  font-size: 20px;
  font-weight: 800;
  margin: 0 8px 18px;
  color: #ffffff;
}

.sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-link {
  display: block;

  padding: 14px 16px;

  border: 1px solid #303847;
  border-radius: 12px;

  background: #252c37;
  color: #e8ebf2;

  text-decoration: none;
  font-size: 15px;
  font-weight: 700;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.sidebar-link:hover {
  background: #303846;
  border-color: #4a566d;
}

.sidebar-link:active {
  transform: scale(.98);
}

.sidebar-link.current {
  background: #2b3450;
  border-color: rgba(101,125,255,.5);
  color: #b9c5ff;
}

/* サイドバー展開時の背景 */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 1050;

  background: rgba(0,0,0,.55);
  backdrop-filter: blur(2px);

  opacity: 0;
  visibility: hidden;

  transition: opacity .25s ease, visibility .25s ease;
}

.menu-overlay.open {
  opacity: 1;
  visibility: visible;
}

/* ========================================
   メインアプリ
======================================== */

.app {
  width: min(800px, 100%);
  background: #191e27;
  border: 1px solid #2d3442;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 18px 50px rgba(0,0,0,.4);
  position: relative;
  overflow: hidden;
}

h1 {
  margin: 0 0 8px;
  text-align: center;

  letter-spacing: .04em;
}

.subtitle {
  text-align: center;
  color: #9da6b6;
  margin-bottom: 20px;
  font-size: 14px;
}

.progress-wrap {
  margin-bottom: 18px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: #aeb7c6;
  font-size: 14px;
  margin-bottom: 8px;
  font-weight: 600;
}

.bar {
  height: 10px;
  background: #292f3a;
  border-radius: 99px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #3b82f6, #10b981);

}

.category-wrap {
  text-align: center;
}

.category {

  padding: 6px 14px;
  border-radius: 999px;
  background: #252c39;
  color: #93c5fd;
  font-size: 13px;
  font-weight: 700;

}

/* 問題文ボックス */
.problem-box {

/* 手書き回答（キャンバス）エリア (目・身体にやさしいダーク仕様) */

.scratchpad-title {

.scratchpad-tools {

.tool-btn {

.scratchpad-canvas {

/* 答えを見るボタン */
.show-answer-btn {

  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 14px;

  color: #fff;

  font-weight: 800;

.show-answer-btn:active {

@keyframes modalIn {

<script>
let audioCtx = null;

/* ハンバーガーメニューの操作 */
const menuButton = document.getElementById("menu-button");
const sidebar = document.getElementById("sidebar");
const menuOverlay = document.getElementById("menu-overlay");

function toggleMenu() {
  const isOpen = sidebar.classList.toggle("open");
  menuOverlay.classList.toggle("open", isOpen);
  menuButton.classList.toggle("open", isOpen);
  menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
  menuButton.setAttribute("aria-label", isOpen ? "メニューを閉じる" : "メニューを開く");
}

function closeMenu() {
  sidebar.classList.remove("open");
  menuOverlay.classList.remove("open");
  menuButton.classList.remove("open");
  menuButton.setAttribute("aria-expanded", "false");
  menuButton.setAttribute("aria-label", "メニューを開く");
}

menuButton.addEventListener("click", toggleMenu);
menuOverlay.addEventListener("click", closeMenu);

/* オーディオ処理 */
function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playCorrectSound() {
  try {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const notes = [
      [523.25, 0.00, 0.12, 0.22],
      [659.25, 0.08, 0.12, 0.22],
      [783.99, 0.16, 0.14, 0.25],
      [1046.50, 0.26, 0.50, 0.30],
      [1318.51, 0.26, 0.50, 0.20]
    ];

    notes.forEach(([freq, startOffset, duration, vol]) => {
      const startTime = now + startOffset;
      const stopTime = startTime + duration;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(freq, startTime);
      gain1.gain.setValueAtTime(vol, startTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, stopTime);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(startTime);
      osc1.stop(stopTime);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq, startTime);
      gain2.gain.setValueAtTime(vol * 0.4, startTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, stopTime);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(startTime);
      osc2.stop(stopTime);
    });
  } catch (e) {}
}

/* 問題データの定義（全16問 / 8問ずつ2セット構成） */
const questionData = [
  // --- セット 1 ---
  { id: 1, set: 1, mondai: "地球上で、北の方角のいちばん端にある地点を何というでしょう。", kotae: "北極" },
  { id: 2, set: 1, mondai: "地球上で、南の方角の端にある地点を何というでしょう。", kotae: "南極" },
  { id: 3, set: 1, mondai: "地球を北半球と南半球に分ける、地球の真ん中を一周する線を何といいますか。", kotae: "赤道" },
  { id: 4, set: 1, mondai: "赤道と平行に、地球を東西に一周する線を何といいますか。", kotae: "緯線" },
  { id: 5, set: 1, mondai: "北極と南極を結ぶように、地球を南北に一周する線を何といいますか。", kotae: "経線" },
  { id: 6, set: 1, mondai: "季節によって、決まった方向からふく風を何といいますか。", kotae: "季節風" },
  { id: 7, set: 1, mondai: "ヨーロッパとアジアにまたがる、世界で最も大きな大陸を何といいますか。", kotae: "ユーラシア大陸" },
  { id: 8, set: 1, mondai: "北海道の北東にあり、日本で最も北に位置する島を何といいますか。", kotae: "択捉島（えとろふとう）" },

  // --- セット 2 ---
  { id: 9, set: 2, mondai: "日本の最も西に位置する島を何といいますか。", kotae: "与那国島" },
  { id: 10, set: 2, mondai: "日本の最も東に位置する島を何といいますか。", kotae: "南鳥島（みなみとりしま）" },
  { id: 11, set: 2, mondai: "日本の最も南に位置する島を何といいますか。", kotae: "沖ノ鳥島" },
  { id: 12, set: 2, mondai: "イギリスのロンドンを通る本初子午線を基準とした経度を何といいますか。", kotae: "経度0度" },
  { id: 13, set: 2, mondai: "日本が標準時（日本の基準となる時間）の基準としている兵庫県明石市を通る経線は東経何度ですか。", kotae: "東経135度" },
  { id: 14, set: 2, mondai: "周囲を太平洋や日本海などの海に囲まれている日本のような国を何といいますか。", kotae: "島国（海洋国）" },
  { id: 15, set: 2, mondai: "陸地が海に突き出た部分のことを何といいますか。", kotae: "半島" },
  { id: 16, set: 2, mondai: "川が山から平野に出るところにできる、扇の形をした地形を何といいますか。", kotae: "扇状地" }
];

const QUESTIONS_PER_SET = 8;
let currentSetIndex = 1;
let questions = [];
let TOTAL = 8;
let current = 0;
let score = 0;
let scratchpadInstance = null;

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

/* 手書きキャンバス (Scratchpad) クラス */
class Scratchpad {
  constructor(canvasEl) {
    this.canvas = canvasEl;
    this.ctx = canvasEl.getContext("2d");
    this.isDrawing = false;
    this.mode = "pen";
    this.lastX = 0;
    this.lastY = 0;
    this.initCanvas();
    this.bindEvents();
  }

  initCanvas() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width;
    this.canvas.height = rect.height;
    this.ctx.lineCap = "round";
    this.ctx.lineJoin = "round";
    this.clear();
  }

  clear() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
  }

  setMode(mode) {
    this.mode = mode;
  }

  getPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  startDrawing(e) {
    e.preventDefault();
    this.isDrawing = true;
    const pos = this.getPos(e);
    this.lastX = pos.x;
    this.lastY = pos.y;
  }

  draw(e) {
    if (!this.isDrawing) return;
    e.preventDefault();
    const pos = this.getPos(e);
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(pos.x, pos.y);

    if (this.mode === "pen") {
      this.ctx.globalCompositeOperation = "source-over";
      // 暗めの背景で見やすい白・明色ペンの指定
      this.ctx.strokeStyle = "#f8fafc";
      this.ctx.lineWidth = 4;
    } else {
      this.ctx.globalCompositeOperation = "destination-out";
      this.ctx.lineWidth = 26;
    }

    this.ctx.stroke();
    this.lastX = pos.x;
    this.lastY = pos.y;
  }

  stopDrawing() {
    this.isDrawing = false;
  }

  bindEvents() {
    this.canvas.addEventListener("pointerdown", (e) => this.startDrawing(e));
    this.canvas.addEventListener("pointermove", (e) => this.draw(e));
    this.canvas.addEventListener("pointerup", () => this.stopDrawing());
    this.canvas.addEventListener("pointerleave", () => this.stopDrawing());
  }
}

/* スタート画面（8問ずつのセット選択） */
function showStart() {
  const totalSets = Math.ceil(questionData.length / QUESTIONS_PER_SET);
  
  let setCardsHtml = "";
  for (let s = 1; s <= totalSets; s++) {
    const setQuestions = questionData.filter(q => q.set === s);
    setCardsHtml += `
      <div class="set-card" data-set="${s}">
        <div class="set-card-header">
          <span class="set-card-badge">全 ${setQuestions.length} 問</span>
        </div>
        <div class="set-card-name">📌 セット ${s}</div>
        <div class="set-card-desc">第 ${(s - 1) * QUESTIONS_PER_SET + 1} 問 〜 第 ${Math.min(s * QUESTIONS_PER_SET, questionData.length)} 問のトレーニング</div>
      </div>
    `;
  }

  document.getElementById("screen").innerHTML = `
    <div class="start">
      <h1>社会科トレーニング</h1>
      <p>
        問題文を読んで、手書き欄に回答を書こう！<br>
        「答えを見る」ボタンを押して自分で答え合わせができます。
      </p>

      <div class="set-selection-title">学習するセットを選択してください：</div>
      <div class="set-grid">
        ${setCardsHtml}
      </div>
    </div>
  `;

  // セットカードのクリックイベントを設定
  document.querySelectorAll(".set-card").forEach(card => {
    card.addEventListener("click", () => {
      const selectedSet = parseInt(card.getAttribute("data-set"), 10);
      initAudio();
      startGame(selectedSet);
    });
  });
}

/* ゲーム開始 */
function startGame(setNum = 1) {
  currentSetIndex = setNum;
  const filteredQuestions = questionData.filter(q => q.set === setNum);
  questions = shuffle(filteredQuestions);
  TOTAL = questions.length;
  current = 0;
  score = 0;
  renderQuestion();
}

/* 問題表示 */
function renderQuestion() {
  const q = questions[current];

  document.getElementById("screen").innerHTML = `
    <div class="progress-wrap">
      <div class="progress-info">
        <span>【セット ${currentSetIndex}】第 ${current + 1} 問 / ${TOTAL} 問</span>
        <span>正解 ${score} 問</span>
      </div>
      <div class="bar">
        <span style="width:${(current / TOTAL) * 100}%"></span>
      </div>
    </div>

    <div class="category-wrap">
      <span class="category">地理・社会用語</span>
    </div>

    <div class="problem-box">
      ${q.mondai}
    </div>

    <!-- 手書き回答エリア (ダーク背景) -->
    <div class="scratchpad-card">
      <div class="scratchpad-header">
        <div class="scratchpad-title">
          ✍️ ここに手書きで答えを書こう
        </div>
        <div class="scratchpad-tools">
          <button class="tool-btn active" id="tool-pen">ペン</button>
          <button class="tool-btn" id="tool-eraser">消しゴム</button>
          <button class="tool-btn" id="tool-clear">全消去</button>
        </div>
      </div>
      <div class="scratchpad-container">
        <canvas id="scratch-canvas" class="scratchpad-canvas"></canvas>
      </div>
    </div>

    <button id="btn-show-answer" class="show-answer-btn">
      答えを見る
    </button>
  `;

  const canvasEl = document.getElementById("scratch-canvas");
  scratchpadInstance = new Scratchpad(canvasEl);

  const penBtn = document.getElementById("tool-pen");
  const eraserBtn = document.getElementById("tool-eraser");
  const clearBtn = document.getElementById("tool-clear");

  penBtn.addEventListener("click", () => {
    scratchpadInstance.setMode("pen");
    penBtn.classList.add("active");
    eraserBtn.classList.remove("active");
  });

  eraserBtn.addEventListener("click", () => {
    scratchpadInstance.setMode("eraser");
    eraserBtn.classList.add("active");
    penBtn.classList.remove("active");
  });

  clearBtn.addEventListener("click", () => {
    scratchpadInstance.clear();
  });

  document.getElementById("btn-show-answer").addEventListener("click", () => {
    initAudio();
    showAnswerModal();
  });
}

/* 正解の紙吹雪演出 */
function celebrate(isLarge = false) {
  if (typeof confetti === "function") {
    try {
      const count = isLarge ? 160 : 100;
      confetti({
        particleCount: count,
        spread: 80,
        startVelocity: 35,
        origin: { y: .65 }
      });

      setTimeout(() => {
        confetti({
          particleCount: Math.round(count * 0.7),
          spread: 120,
          startVelocity: 28,
          origin: { x: .15, y: .7 }
        });
      }, 120);

      setTimeout(() => {
        confetti({
          particleCount: Math.round(count * 0.7),
          spread: 120,
          startVelocity: 28,
          origin: { x: .85, y: .7 }
        });
      }, 220);
    } catch(e) {}
  }
}

/* 答え合わせモーダル表示 */
function showAnswerModal() {
  const q = questions[current];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title">正解の確認</div>
      <div class="modal-problem">${q.mondai}</div>
      <div class="modal-label">正しい答え</div>
      <div class="modal-answer">${q.kotae}</div>
      
      <div style="font-size:14px; color:#adb5c4; margin-bottom:14px;">
        書いた答えは合っていましたか？
      </div>

      <div class="modal-choices">
        <button class="modal-button btn-wrong" id="btn-self-wrong">❌ 違っていた</button>
        <button class="modal-button btn-correct" id="btn-self-correct">⭕ 合っていた！</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const handleChoice = (isCorrect) => {
    overlay.remove();
    if (isCorrect) {
      score++;
      playCorrectSound();
      celebrate(false);
    }
    nextQuestion();
  };

  overlay.querySelector("#btn-self-correct").addEventListener("click", () => handleChoice(true));
  overlay.querySelector("#btn-self-wrong").addEventListener("click", () => handleChoice(false));
}

/* 完走モーダル */
function showCompletionModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title celebrate">🎉 おつかれさまでした！</div>
      <div style="font-size:20px; font-weight:800; color:#f2f4f8; margin:14px 0 8px;">
        セット ${currentSetIndex} 完了！
      </div>
      <div style="color:#adb5c4; font-size:15px; line-height:1.6; margin-bottom:20px;">
        トレー二ングを完走しました！<br>
        最終結果:
        <strong style="color:#60a5fa; font-size:26px;">
          ${score} / ${TOTAL}
        </strong>
        問正解
      </div>
      <button class="modal-button btn-primary" id="modal-result-btn" style="width:100%;">結果画面へ</button>
    </div>
  `;

  document.body.appendChild(overlay);

  playCorrectSound();
  celebrate(true);

  overlay.querySelector("#modal-result-btn").addEventListener("click", () => {
    overlay.remove();
    showResult();
  });
}

/* 次の問題へ */
function nextQuestion() {
  current++;
  if (current >= TOTAL) {
    showCompletionModal();
  } else {
    renderQuestion();
  }
}

/* 結果画面 */
function showResult() {
  const percent = Math.round((score / TOTAL) * 100);

  const message =
    percent === 100
      ? "🏆 パーフェクト！社会マスターだね！"
      : percent >= 80
      ? "🌟 よくできました！素晴らしい記憶力！"
      : percent >= 50
      ? "👏 がんばったね！繰り返し復習しよう！"
      : "💪 何度もチャレンジして覚えよう！";

  document.getElementById("screen").innerHTML = `
    <div class="result">
      <h1>セット ${currentSetIndex} 終了！</h1>
      <div class="score">${score} / ${TOTAL}</div>
      <div class="subtitle">正解率 ${percent}%</div>
      <p>${message}</p>
      <button id="btn-restart" class="btn-primary">もう一度同じセットを挑戦</button>
      <button id="btn-end" class="btn-secondary">セット選択にもどる</button>
    </div>
  `;

  document.getElementById("btn-restart").addEventListener("click", () => {
    initAudio();
    startGame(currentSetIndex);
  });

  document.getElementById("btn-end").addEventListener("click", () => {
    initAudio();
    showStart();
  });
}

/* 初期表示 */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", showStart);
} else {
  showStart();
}
</script>
