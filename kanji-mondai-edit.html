<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字問題データエディター (mondai.json)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-sky-500/20 p-2.5 rounded-xl border border-sky-500/30 text-sky-400">
                        <i class="fa-solid me-0.5 fa-book-bookmark text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                            漢字問題マネージャー
                        </h1>
                        <p class="text-xs text-slate-400">mondai.json 編集・管理システム</p>
                    </div>
                </div>

                <!-- Global Stats & Action Buttons -->
                <div class="flex flex-wrap items-center gap-2 text-sm">
                    <div class="bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700/80 text-slate-300 font-medium">
                        総問題数: <span id="total-count" class="text-sky-400 font-bold text-base">0</span> 件
                    </div>
                    
                    <button onclick="openJsonModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-code text-xs"></i> JSON閲覧/出力
                    </button>
                    
                    <label class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-file-import text-xs"></i> インポート
                        <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="importJsonFile(event)">
                    </label>

                    <button onclick="reloadExternalJson()" class="px-3 py-1.5 bg-sky-900/60 hover:bg-sky-800/80 text-sky-200 border border-sky-700/50 rounded-lg text-sm font-medium transition flex items-center gap-1.5" title="外部JSONから再読み込み">
                        <i class="fa-solid fa-cloud-arrow-down text-xs"></i> サーバーから再取得
                    </button>

                    <button onclick="confirmResetData()" class="px-3 py-1.5 bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/50 rounded-lg text-sm font-medium transition flex items-center gap-1.5" title="初期データに戻す">
                        <i class="fa-solid fa-rotate-left text-xs"></i> リセット
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Add Question Form -->
            <div class="lg:col-span-5">
                <div class="bg-slate-800/60 rounded-2xl border border-slate-700/60 p-6 shadow-xl sticky top-24">
                    <h2 class="text-lg font-semibold text-slate-100 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus text-sky-400"></i> 新しい問題の追加
                    </h2>
                    
                    <form id="add-question-form" onsubmit="handleAddQuestion(event)" class="space-y-4">
                        <!-- Kanji Input Grid (4 Textboxes) -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                対象漢字 (最大4つ・空欄は自動無視)
                            </label>
                            <div class="grid grid-cols-4 gap-2">
                                <div>
                                    <input type="text" id="add-kanji-1" maxlength="2" placeholder="漢字1" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                                </div>
                                <div>
                                    <input type="text" id="add-kanji-2" maxlength="2" placeholder="漢字2" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                                </div>
                                <div>
                                    <input type="text" id="add-kanji-3" maxlength="2" placeholder="漢字3" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                                </div>
                                <div>
                                    <input type="text" id="add-kanji-4" maxlength="2" placeholder="漢字4" class="w-full text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                                </div>
                            </div>
                        </div>

                        <!-- Question Text -->
                        <div>
                            <label for="add-mondai" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                                問題文 <span class="text-xs font-normal text-slate-400">（例: （きょ）（か）を 得る。）</span>
                            </label>
                            <input type="text" id="add-mondai" required placeholder="（きょ）（か）を 得る。" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                        </div>

                        <!-- Reading / Yomikata -->
                        <div>
                            <label for="add-yomikata" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                                ふりがな / よみかた <span class="text-xs font-normal text-slate-400">（例: きょかをえる）</span>
                            </label>
                            <input type="text" id="add-yomikata" required placeholder="きょかをえる" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-sky-600/20 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> 問題を追加する
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Search & Questions List -->
            <div class="lg:col-span-7">
                <!-- Search & Filters -->
                <div class="bg-slate-800/60 rounded-2xl border border-slate-700/60 p-4 mb-6 flex flex-col sm:flex-row gap-3 items-center">
                    <div class="relative w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" oninput="renderQuestions()" placeholder="漢字、問題文、読み方で検索..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                    </div>
                    <button onclick="clearSearch()" class="text-xs text-slate-400 hover:text-slate-200 whitespace-nowrap px-2 py-1">
                        クリア
                    </button>
                </div>

                <!-- Questions List Container -->
                <div id="questions-list" class="space-y-3">
                    <!-- Cards will be injected via JS -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-12 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700">
                    <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
                    <p class="text-slate-400">該当する漢字問題が見つかりません</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <h3 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-sky-400"></i> 問題の編集
            </h3>
            
            <form id="edit-question-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
                <input type="hidden" id="edit-index">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        対象漢字 (最大4つ)
                    </label>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="edit-kanji-1" maxlength="2" placeholder="漢字1" class="text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100">
                        <input type="text" id="edit-kanji-2" maxlength="2" placeholder="漢字2" class="text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100">
                        <input type="text" id="edit-kanji-3" maxlength="2" placeholder="漢字3" class="text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100">
                        <input type="text" id="edit-kanji-4" maxlength="2" placeholder="漢字4" class="text-center bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-slate-100">
                    </div>
                </div>

                <div>
                    <label for="edit-mondai" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">問題文</label>
                    <input type="text" id="edit-mondai" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
                </div>

                <div>
                    <label for="edit-yomikata" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">ふりがな / よみかた</label>
                    <input type="text" id="edit-yomikata" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-sm transition">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-xl text-sm transition">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JSON Preview / Export Modal -->
    <div id="json-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-code text-sky-400"></i> JSON プレビュー / 出力
                </h3>
                <button onclick="closeJsonModal()" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <textarea id="json-textarea" readonly class="w-full flex-grow bg-slate-950 text-emerald-400 font-mono text-xs rounded-xl p-4 border border-slate-800 resize-none focus:outline-none mb-4"></textarea>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <button onclick="copyJsonToClipboard()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-100 rounded-xl text-sm transition flex items-center gap-2">
                    <i class="fa-regular fa-copy"></i> クリップボードにコピー
                </button>
                <div class="flex gap-2">
                    <button onclick="closeJsonModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-sm transition">
                        閉じる
                    </button>
                    <button onclick="downloadJsonFile()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-xl text-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> mondai.json をダウンロード
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 border border-sky-500/50 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-sky-400 text-lg"></i>
        <span id="toast-message" class="text-sm">メッセージ</span>
    </div>

    <script>
        const JSON_URL = 'https://hinatabokko-jp.github.io/hinatabokko-app/mondai.json';

        // Initial Dataset as fallback if fetch fails
        const INITIAL_DATA = [
          {"kanji":["許","可"],"mondai":"（きょ）（か）を 得る。","yomikata":"きょかをえる"},
          {"kanji":["貿","易"],"mondai":"（ぼう）（えき）が 盛んだ。","yomikata":"ぼうえきがさかんだ"},
          {"kanji":["技","術"],"mondai":"（ぎ）（じゅつ）を 身につける。","yomikata":"ぎじゅつをみにつける"}
          // ※長すぎるため省略せず、もとのINITIAL_DATAがそのまま入ります
        ];

        // State
        let questionsData = [];

        // Load data on page load (Fetch from URL)
        window.addEventListener('DOMContentLoaded', async () => {
            await loadMondaiData();
        });

        async function loadMondaiData() {
            showToast("外部JSONデータを読み込んでいます...");
            try {
                const response = await fetch(JSON_URL + '?t=' + new Date().getTime()); // キャッシュ回避
                if (!response.ok) throw new Error('ネットワークエラー');
                const data = await response.json();
                if (Array.isArray(data)) {
                    questionsData = data;
                    saveDataToLocal(false); // ローカルストレージにも同期
                    showToast("外部JSONからデータを読み込みました！");
                } else {
                    throw new Error('フォーマット不正');
                }
            } catch (error) {
                console.warn("外部JSONの取得に失敗しました。ローカルストレージまたはフォールバックを使用します。", error);
                const savedData = localStorage.getItem('mondai_json_data');
                if (savedData) {
                    try {
                        questionsData = JSON.parse(savedData);
                        showToast("保存済みのローカルデータを読み込みました");
                    } catch(e) {
                        questionsData = [...INITIAL_DATA];
                    }
                } else {
                    questionsData = [...INITIAL_DATA];
                }
            }
            renderQuestions();
        }

        // Save State to LocalStorage
        function saveData() {
            saveDataToLocal(true);
        }

        function saveDataToLocal(showNotification = true) {
            localStorage.setItem('mondai_json_data', JSON.stringify(questionsData));
            updateTotalCount();
            if (showNotification) {
                showToast("変更を保存しました");
            }
        }

        function updateTotalCount() {
            document.getElementById('total-count').textContent = questionsData.length;
        }

        // Helper: Collect non-empty kanji inputs from 4 fields
        function extractKanjiArray(prefix) {
            const result = [];
            for (let i = 1; i <= 4; i++) {
                const val = document.getElementById(`${prefix}-kanji-${i}`).value.trim();
                if (val !== "") {
                    result.push(val);
                }
            }
            return result;
        }

        // Helper: Set 4 kanji fields from array
        function setKanjiFields(prefix, kanjiArray = []) {
            for (let i = 1; i <= 4; i++) {
                const input = document.getElementById(`${prefix}-kanji-${i}`);
                input.value = kanjiArray[i - 1] || "";
            }
        }

        // Handle Add Question Form Submission
        function handleAddQuestion(e) {
            e.preventDefault();
            const kanji = extractKanjiArray('add');
            const mondai = document.getElementById('add-mondai').value.trim();
            const yomikata = document.getElementById('add-yomikata').value.trim();

            if (kanji.length === 0) {
                showToast("漢字を少なくとも1つ入力してください");
                return;
            }

            const newItem = { kanji, mondai, yomikata };
            questionsData.unshift(newItem); // Add to beginning
            saveData();
            renderQuestions();

            // Reset form
            document.getElementById('add-question-form').reset();
            showToast("新しい問題を追加しました！");
        }

        // Render Questions List
        function renderQuestions() {
            updateTotalCount();
            const listEl = document.getElementById('questions-list');
            const emptyEl = document.getElementById('empty-state');
            const searchVal = document.getElementById('search-input').value.trim().toLowerCase();

            listEl.innerHTML = '';

            const filtered = questionsData.filter((q, index) => {
                q._originalIndex = index; // Store original reference
                if (!searchVal) return true;
                const matchKanji = q.kanji.some(k => k.toLowerCase().includes(searchVal));
                const matchMondai = q.mondai.toLowerCase().includes(searchVal);
                const matchYomi = q.yomikata.toLowerCase().includes(searchVal);
                return matchKanji || matchMondai || matchYomi;
            });

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            filtered.forEach((q) => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 rounded-2xl p-4 transition shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4";
                
                // Kanji Badges
                const kanjiBadges = q.kanji.map(k => 
                    `<span class="inline-flex items-center justify-center bg-sky-950 text-sky-300 border border-sky-600/40 font-bold px-2.5 py-1 rounded-lg text-sm">${escapeHtml(k)}</span>`
                ).join(' ');

                card.innerHTML = `
                    <div class="space-y-1.5 flex-1">
                        <div class="flex flex-wrap items-center gap-1.5 mb-1">
                            ${kanjiBadges}
                        </div>
                        <div class="text-slate-100 font-medium text-base tracking-wide">
                            ${escapeHtml(q.mondai)}
                        </div>
                        <div class="text-xs text-sky-400/80 font-mono">
                            よみ: ${escapeHtml(q.yomikata)}
                        </div>
                    </div>

                    <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                        <button onclick="openEditModal(${q._originalIndex})" class="px-3 py-1.5 bg-slate-700/80 hover:bg-sky-600/30 hover:text-sky-300 text-slate-300 border border-slate-600/50 hover:border-sky-500/50 rounded-xl text-xs font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-pen-to-square"></i> 編集
                        </button>
                        <button onclick="deleteQuestion(${q._originalIndex})" class="px-3 py-1.5 bg-slate-700/80 hover:bg-rose-950/80 hover:text-rose-300 text-slate-300 border border-slate-600/50 hover:border-rose-800/50 rounded-xl text-xs font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 削除
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderQuestions();
        }

        // Delete Question
        function deleteQuestion(index) {
            if (confirm("この問題を削除してもよろしいですか？")) {
                questionsData.splice(index, 1);
                saveData();
                renderQuestions();
                showToast("問題を削除しました");
            }
        }

        // Edit Modal Operations
        function openEditModal(index) {
            const q = questionsData[index];
            document.getElementById('edit-index').value = index;
            setKanjiFields('edit', q.kanji);
            document.getElementById('edit-mondai').value = q.mondai;
            document.getElementById('edit-yomikata').value = q.yomikata;

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function handleSaveEdit(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('edit-index').value, 10);
            const kanji = extractKanjiArray('edit');
            const mondai = document.getElementById('edit-mondai').value.trim();
            const yomikata = document.getElementById('edit-yomikata').value.trim();

            if (kanji.length === 0) {
                showToast("漢字を少なくとも1つ入力してください");
                return;
            }

            questionsData[index] = { kanji, mondai, yomikata };
            saveData();
            renderQuestions();
            closeEditModal();
            showToast("変更を保存しました");
        }

        // JSON Modal Operations
        function openJsonModal() {
            const cleanData = questionsData.map(({ kanji, mondai, yomikata }) => ({ kanji, mondai, yomikata }));
            document.getElementById('json-textarea').value = JSON.stringify(cleanData, null, 2);
            document.getElementById('json-modal').classList.remove('hidden');
        }

        function closeJsonModal() {
            document.getElementById('json-modal').classList.add('hidden');
        }

        function copyJsonToClipboard() {
            const textarea = document.getElementById('json-textarea');
            textarea.select();
            document.execCommand('copy');
            showToast("JSONをクリップボードにコピーしました");
        }

        function downloadJsonFile() {
            const cleanData = questionsData.map(({ kanji, mondai, yomikata }) => ({ kanji, mondai, yomikata }));
            const jsonStr = JSON.stringify(cleanData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mondai.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast("mondai.json をダウンロードしました");
        }

        // File Import
        function importJsonFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        const isValid = parsed.every(item => item.kanji && Array.isArray(item.kanji) && item.mondai && item.yomikata);
                        if (!isValid) {
                            showToast("JSONフォーマットが正しくありません (kanji, mondai, yomikata が必要です)");
                            return;
                        }
                        questionsData = parsed;
                        saveData();
                        renderQuestions();
                        showToast(`${parsed.length} 件のデータをインポートしました！`);
                    } else {
                        showToast("JSONのルートエレメントは配列である必要があります");
                    }
                } catch (err) {
                    showToast("JSONの読み込み中にエラーが発生しました");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Reload External JSON
        async function reloadExternalJson() {
            if (confirm("サーバー（GitHub）から最新のJSONデータを再取得しますか？（未保存の変更がある場合は上書きされる可能性があります）")) {
                await loadMondaiData();
            }
        }

        // Reset Data
        function confirmResetData() {
            if (confirm("データを変更前の初期状態に戻しますか？")) {
                questionsData = [...INITIAL_DATA];
                saveData();
                renderQuestions();
                showToast("初期データにリセットしました");
            }
        }

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // HTML Escape helper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
