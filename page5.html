<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビジネス用語クイズ</title>
  <!-- 紙吹雪（クラッカー）用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- STREAMING_CHUNK:Styling the dark mode interface... -->
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --correct-color: #4ade80;
      --wrong-color: #f87171;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .title {
      font-size: 1.1rem;
      color: var(--text-sub);
    }

    .progress {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .question-box {
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid var(--accent-color);
    }

    .question-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.25rem;
      line-height: 1.6;
    }

    /* 問題文中のキーワード強調スタイル */
    .highlight-word {
      font-size: 1.4rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 4px;
      border-bottom: 2px solid var(--accent-color);
      display: inline-block;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background-color: #273549;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #334155;
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: rgba(74, 222, 128, 0.15);
      border-color: var(--correct-color);
      color: var(--correct-color);
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: rgba(248, 113, 113, 0.15);
      border-color: var(--wrong-color);
      color: var(--wrong-color);
      opacity: 0.7;
    }

    .result-box {
      display: none;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-status {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-status.correct { color: var(--correct-color); }
    .result-status.wrong { color: var(--wrong-color); }

    .explanation-title {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .explanation-text {
      font-size: 1rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .action-btn {
      display: none;
      width: 100%;
      background: var(--accent-gradient);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .action-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* 最終結果画面 */
    .final-score-screen {
      display: none;
      text-align: center;
      padding: 20px 0;
      animation: fadeIn 0.4s ease;
    }

    .final-score-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: var(--text-color);
    }

    .score-display {
      font-size: 3rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 16px 0;
    }

    .score-comment {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 28px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- STREAMING_CHUNK:Rendering HTML container... -->
  <div class="quiz-container">
    <div class="header">
      <div class="title">ビジネス用語マスター</div>
      <div class="progress" id="progress">第 1 / 10 問</div>
    </div>

    <!-- クイズ本体表示エリア -->
    <div id="quizBody">
      <div class="question-box">
        <div class="question-label">以下の文の言葉の意味として最も適切なものは？</div>
        <div class="question-text" id="questionText"></div>
      </div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="result-box" id="resultBox">
        <div class="result-status" id="resultStatus"></div>
        <div class="explanation-title">【解説】</div>
        <div class="explanation-text" id="explanationText"></div>
      </div>

      <button class="action-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <!-- 10問完了時の結果画面 -->
    <div class="final-score-screen" id="finalScoreScreen">
      <div class="final-score-title">🎯 クイズ結果 🎯</div>
      <div class="score-display" id="finalScoreText">0 / 10</div>
      <div class="score-comment" id="scoreComment"></div>
      <button class="action-btn" id="restartBtn" style="display: block;" onclick="initQuiz()">もう一度挑戦する</button>
    </div>
  </div>

  <script>
    /* STREAMING_CHUNK:Defining business terms dataset... */
    const quizData = [
      { word: "アジェンダ", meaning: "議題", detail: "会議や打ち合わせで「何について話すのか」を整理したもの。普通に「議題」と言えばいいところを、あえてアジェンダと言うと一気にビジネス感が増す。", example: "今日のアジェンダを最初に共有しておきます。" },
      { word: "アサイン", meaning: "割り当て", detail: "仕事や役割を人に割り当てること。「担当してもらう」「任せる」という意味で使われる。", example: "この案件、誰をアサインするか決めておきましょう。" },
      { word: "アグリー", meaning: "賛成", detail: "相手の意見や提案に同意すること。「賛成です」よりも「アグリーです」と言うと、会議っぽい雰囲気が出る。", example: "その方向性については私もアグリーです。" },
      { word: "エビデンス", meaning: "根拠", detail: "主張や判断を裏付ける資料・データ・証拠のこと。", example: "その数字について、何かエビデンスはありますか？" },
      { word: "エスカレーション", meaning: "上位者への相談・報告", detail: "自分の判断だけでは対応できない問題を、上司や責任者など、より上位の人に引き上げて対応してもらうこと。", example: "この件は現場だけでは判断できないので、上長にエスカレーションします。" },
      { word: "オンボーディング", meaning: "受け入れ・定着支援", detail: "新しく入った人が、組織や仕事に慣れて一人で業務を進められるようになるまで支援すること。", example: "新入社員のオンボーディングについて、もう少し手厚くしたいです。" },
      { word: "コミット", meaning: "責任を持って取り組む", detail: "目標や仕事に対して、責任を持って達成に向けて取り組むこと。", example: "この数字については、今期中の達成にコミットします。" },
      { word: "コンセンサス", meaning: "合意", detail: "関係者の間で意見を調整し、共通の認識や合意を得ること。", example: "まずは関係者間でコンセンサスを取っておきましょう。" },
      { word: "シナジー", meaning: "相乗効果", detail: "複数の人・組織・サービスなどを組み合わせることで、それぞれ単独で行うより大きな効果が生まれること。", example: "営業部と企画部が連携することで、大きなシナジーが期待できます。" },
      { word: "スキーム", meaning: "仕組み・枠組み", detail: "物事を進めるための仕組みや計画、構造のこと。", example: "まずは全体のスキームを整理してから詳細を詰めましょう。" },
      { word: "タスク", meaning: "作業・仕事", detail: "やるべき具体的な仕事や作業のこと。", example: "今日中に終わらせるタスクを洗い出しましょう。" },
      { word: "ナレッジ", meaning: "知識・知見", detail: "仕事を通じて得られた知識や経験、ノウハウなどのこと。", example: "今回の対応で得たナレッジを、チーム内で共有しましょう。" },
      { word: "バッファ", meaning: "余裕・予備", detail: "予定やスケジュール、予算などにあらかじめ設けておく余裕のこと。", example: "納期には多少バッファを持たせておいたほうが安全です。" },
      { word: "フィードバック", meaning: "意見・改善点", detail: "仕事や成果物などについて、相手に改善のための意見や評価を伝えること。", example: "一度資料を見てもらって、フィードバックをもらえますか？" },
      { word: "プライオリティ", meaning: "優先順位", detail: "複数の仕事や課題について、どれを優先して進めるかという順位。", example: "まずはプライオリティの高い案件から対応しましょう。" },
      { word: "ベネフィット", meaning: "利益・メリット", detail: "商品やサービスなどを利用することで、相手が得られる価値や利益のこと。", example: "このサービスを導入するベネフィットを明確にしましょう。" },
      { word: "ペンディング", meaning: "保留", detail: "すぐには決定・実行せず、いったん保留にしておくこと。", example: "この件はいったんペンディングでお願いします。" },
      { word: "ボトルネック", meaning: "障害・妨げ", detail: "物事が進むのを妨げている最大の原因や部分のこと。", example: "現在のボトルネックは、確認作業に時間がかかっていることです。" },
      { word: "マイルストーン", meaning: "節目・中間目標", detail: "大きな目標に向かって進む際に設定する重要な中間地点や節目のこと。", example: "まずは来月末を最初のマイルストーンに設定しましょう。" },
      { word: "リソース", meaning: "人員・資源", detail: "仕事を進めるために必要な人・時間・お金・設備などの資源のこと。", example: "このプロジェクトには、もう少しリソースが必要です。" },
      { word: "ローンチ", meaning: "開始・公開", detail: "新しい商品やサービスなどを正式に世に出すこと。", example: "新サービスは来月ローンチ予定です。" },
      { word: "アジェンダセッティング", meaning: "議題設定", detail: "会議などで、何を話し合うのかをあらかじめ設定すること。", example: "次回の会議に向けて、アジェンダセッティングをしておきます。" },
      { word: "イシュー", meaning: "重要な課題・論点", detail: "単なる問題ではなく、解決すべき重要な課題や議論すべき論点を指す。", example: "まず今回のイシューが何なのかを明確にしましょう。" },
      { word: "インサイト", meaning: "本質的な気づき", detail: "データや事実を分析することで得られる、表面的ではない重要な気づきや発見。", example: "アンケート結果から、意外なインサイトが得られました。" },
      { word: "オポチュニティ", meaning: "機会・好機", detail: "ビジネス上の成長につながる可能性のある機会やチャンス。", example: "今回の案件を新しい顧客層へのオポチュニティとして捉えたいです。" },
      { word: "ドライブ", meaning: "推進する", detail: "物事を積極的に前に進めること。", example: "このプロジェクトは私が中心となってドライブしていきます。" },
      { word: "ブラッシュアップ", meaning: "改善・磨き上げ", detail: "すでにある企画や資料、アイデアなどをさらに良くすること。", example: "この資料はもう少しブラッシュアップしてから提出しましょう。" },
      { word: "リスケ", meaning: "予定変更", detail: "「リ・スケジュール」の略で、予定やスケジュールを組み直すこと。", example: "申し訳ありませんが、会議を来週にリスケできますか？" },
      { word: "アジャイル", meaning: "柔軟・素早く改善する", detail: "最初から完璧なものを作ろうとせず、小さく始めて状況を見ながら素早く改善していく考え方。", example: "今回はアジャイルな進め方で、まず試作品を作ってみましょう。" },
      { word: "PDCA", meaning: "計画・実行・評価・改善", detail: "Plan（計画）、Do（実行）、Check（評価）、Action（改善）の頭文字。仕事を継続的に改善していく考え方。", example: "一度やって終わりではなく、PDCAを回して改善していきましょう。" },
      { word: "KPI", meaning: "重要な達成指標", detail: "最終的な目標に向かって順調に進んでいるかを確認するための具体的な指標。", example: "今月のKPIをどこに設定するか決めましょう。" },
      { word: "KGI", meaning: "最終目標", detail: "プロジェクトや事業において、最終的に達成したい具体的な目標。", example: "KGIから逆算して、必要なKPIを設定しましょう。" },
      { word: "DX", meaning: "デジタル化による業務・仕組みの変革", detail: "デジタル技術を使って、単なる業務のデジタル化にとどまらず、仕事やサービスそのものを変えていくこと。", example: "単に紙を電子化するだけではなく、業務全体をDXしていきたいです。" },
      { word: "リテラシー", meaning: "活用するための知識・能力", detail: "ある分野について、情報を理解し、適切に活用するための知識や能力。", example: "社員のITリテラシーを高める必要があります。" },
      { word: "マインドセット", meaning: "考え方・心構え", detail: "物事に対する基本的な考え方や捉え方。", example: "新しいことに挑戦するためには、まずマインドセットを変える必要があります。" },
      { word: "アウトプット", meaning: "成果・外に出すもの", detail: "学んだことや考えたことを、資料・成果物・発言などの形にして外へ出すこと。", example: "インプットするだけではなく、積極的にアウトプットしていきましょう。" },
      { word: "インプット", meaning: "情報・知識を取り込むこと", detail: "本や資料、人の話などから知識や情報を得ること。", example: "まずは他社の事例をインプットしておきましょう。" },
      { word: "アウフヘーベン", meaning: "対立するものを統合して新しい段階へ進むこと", detail: "哲学用語が由来で、対立する二つの考えを単純にどちらか選ぶのではなく、両方を活かしてより高い次元の考えにまとめること。", example: "コスト削減とサービス品質、この二つをアウフヘーベンできる方法を考えましょう。" }
    ];

    const TOTAL_QUESTIONS_PER_ROUND = 10; // 1回の出題数
    let currentQuestionIndex = 0;
    let shuffledQuizList = [];
    let correctCount = 0;

    /* STREAMING_CHUNK:Configuring audio synthesized feedback... */
    // Web Audio API による「かわいい効果音」の再生
    function playCuteWinSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        // かわいらしい高音の和音ポロロン（C6 - E6 - G6 - C7）
        const notes = [1046.50, 1318.51, 1567.98, 2093.00];
        
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sine'; // まろやかな正弦波
          osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.08);
          
          // ポップでかわいいエンベロープ
          gain.gain.setValueAtTime(0, ctx.currentTime + index * 0.08);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + index * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.08 + 0.3);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(ctx.currentTime + index * 0.08);
          osc.stop(ctx.currentTime + index * 0.08 + 0.3);
        });
      } catch (e) {
        console.log("Audio play failed:", e);
      }
    }

    // 配列のシャッフル関数
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* STREAMING_CHUNK:Initializing state and question handler... */
    // 初期化（全体の全問題からランダムで10問のみピックアップ）
    function initQuiz() {
      shuffledQuizList = shuffleArray(quizData).slice(0, TOTAL_QUESTIONS_PER_ROUND);
      currentQuestionIndex = 0;
      correctCount = 0;

      document.getElementById('quizBody').style.display = 'block';
      document.getElementById('finalScoreScreen').style.display = 'none';

      loadQuestion();
    }

    // 問題の読み込み
    function loadQuestion() {
      const q = shuffledQuizList[currentQuestionIndex];
      
      // 進捗表示
      document.getElementById('progress').innerText = `第 ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS_PER_ROUND} 問`;

      // 例文中のターゲット語句を強調表示に置換
      const highlightedExample = q.example.replace(
        q.word, 
        `<span class="highlight-word">${q.word}</span>`
      );
      document.getElementById('questionText').innerHTML = `「 ${highlightedExample} 」`;

      // 画面の初期化
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      // 選択肢の作成（正解1個 + 誤答4個 = 計5個）
      const otherMeanings = quizData
        .filter(item => item.word !== q.word)
        .map(item => item.meaning);
      
      const wrongChoices = shuffleArray(otherMeanings).slice(0, 4);
      const allChoices = shuffleArray([q.meaning, ...wrongChoices]);

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      allChoices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = choice;
        btn.onclick = () => selectOption(choice, q);
        optionsContainer.appendChild(btn);
      });
    }

    /* STREAMING_CHUNK:Handling option clicks and celebration... */
    // 選択肢クリック時の処理
    function selectOption(selected, currentQuiz) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true); // 連打防止

      const isCorrect = (selected === currentQuiz.meaning);
      const resultBox = document.getElementById('resultBox');
      const resultStatus = document.getElementById('resultStatus');
      const explanationText = document.getElementById('explanationText');

      if (isCorrect) {
        correctCount++;
        resultStatus.className = 'result-status correct';
        resultStatus.innerHTML = '🎉 正解！';
        
        // お祝いクラッカー（紙吹雪）
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });

        // かわいい効果音を鳴らす
        playCuteWinSound();
      } else {
        resultStatus.className = 'result-status wrong';
        resultStatus.innerHTML = '❌ 不正解...';
      }

      // 選択肢のスタイル反映
      buttons.forEach(btn => {
        if (btn.innerText === currentQuiz.meaning) {
          btn.classList.add('correct');
        } else if (btn.innerText === selected && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      // 解説の表示
      explanationText.innerHTML = `<strong>【${currentQuiz.word}】</strong> ${currentQuiz.meaning}<br><br>${currentQuiz.detail}`;
      resultBox.style.display = 'block';
      
      // ボタンテキストの決定
      const nextBtn = document.getElementById('nextBtn');
      if (currentQuestionIndex === TOTAL_QUESTIONS_PER_ROUND - 1) {
        nextBtn.innerText = "結果を見る";
      } else {
        nextBtn.innerText = "次の問題へ";
      }
      nextBtn.style.display = 'block';
    }

    /* STREAMING_CHUNK:Managing quiz navigation and final screen... */
    // 次の問題へ（または最終結果表示）
    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < TOTAL_QUESTIONS_PER_ROUND) {
        loadQuestion();
      } else {
        showFinalResults();
      }
    }

    // 最終結果画面の表示
    function showFinalResults() {
      document.getElementById('quizBody').style.display = 'none';
      document.getElementById('finalScoreScreen').style.display = 'block';
      document.getElementById('progress').innerText = "完了！";

      document.getElementById('finalScoreText').innerText = `${correctCount} / ${TOTAL_QUESTIONS_PER_ROUND}`;

      const commentEl = document.getElementById('scoreComment');
      if (correctCount === 10) {
        commentEl.innerText = "パーフェクト！ビジネス用語マスターです👏";
        // 10問全問正解時の大連鎖クラッカー
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
      } else if (correctCount >= 7) {
        commentEl.innerText = "素晴らしい結果です！この調子で使いこなしていきましょう！";
      } else if (correctCount >= 4) {
        commentEl.innerText = "惜しい！繰り返し解いて定着させましょう。";
      } else {
        commentEl.innerText = "伸びしろタップリ！もう一度挑戦してみましょう。";
      }
    }

    // 起動
    window.onload = initQuiz;
  </script>
</body>
</html>
