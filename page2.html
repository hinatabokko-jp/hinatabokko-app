<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>計算トレーニング</title>
  
  <!-- アプリのアイコン設定 (kurimanjuu.png) -->
<link rel="icon" href="kurimanjuu.png" type="image/png">
<link rel="apple-touch-icon" href="kurimanjuu.png">
  
<!-- confetti.js for celebration effects -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", "Noto Sans JP", -apple-system, sans-serif;
  background: #10131a;
  color: #f2f4f8;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  touch-action: manipulation;
  user-select: none;
}

/* ========================================
   ハンバーガーメニュー
======================================== */

.menu-button {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1200;

  width: 48px;
  height: 48px;

  border: 1px solid #394252;
  border-radius: 14px;
  background: #191e27;
  color: #f2f4f8;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;

  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,.35);

  transition: background .15s ease, transform .15s ease;
}

.menu-button:hover {
  background: #252c37;
}

.menu-button:active {
  transform: scale(.95);
}

.menu-button span {
  display: block;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: #f2f4f8;
  transition: transform .2s ease, opacity .2s ease;
}

/* メニューが開いているとき */
.menu-button.open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.menu-button.open span:nth-child(2) {
  opacity: 0;
}

.menu-button.open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* サイドバー */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1100;

  width: min(320px, 85vw);
  height: 100vh;

  background: #191e27;
  border-right: 1px solid #2d3442;

  padding: 84px 18px 24px;

  transform: translateX(-100%);
  transition: transform .25s ease;

  box-shadow: 18px 0 50px rgba(0,0,0,.45);
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-title {
  font-size: 20px;
  font-weight: 800;
  margin: 0 8px 18px;
  color: #ffffff;
}

.sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-link {
  display: block;

  padding: 14px 16px;

  border: 1px solid #303847;
  border-radius: 12px;

  background: #252c37;
  color: #e8ebf2;

  text-decoration: none;
  font-size: 15px;
  font-weight: 700;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.sidebar-link:hover {
  background: #303846;
  border-color: #4a566d;
}

.sidebar-link:active {
  transform: scale(.98);
}

.sidebar-link.current {
  background: #2b3450;
  border-color: rgba(101,125,255,.5);
  color: #b9c5ff;
}

/* サイドバー展開時の背景 */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 1050;

  background: rgba(0,0,0,.55);
  backdrop-filter: blur(2px);

  opacity: 0;
  visibility: hidden;

  transition: opacity .25s ease, visibility .25s ease;
}

.menu-overlay.open {
  opacity: 1;
  visibility: visible;
}

/* ========================================
   メインアプリ
======================================== */

.app {
  width: min(780px, 100%);
  background: #191e27;
  border: 1px solid #2d3442;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 18px 50px rgba(0,0,0,.4);
  position: relative;
  overflow: hidden;
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: clamp(24px, 5vw, 32px);
  letter-spacing: .04em;
}

.subtitle {
  text-align: center;
  color: #9da6b6;
  margin-bottom: 20px;
  font-size: 14px;
}

.progress-wrap {
  margin-bottom: 18px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: #aeb7c6;
  font-size: 14px;
  margin-bottom: 8px;
  font-weight: 600;
}

.bar {
  height: 10px;
  background: #292f3a;
  border-radius: 99px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #657dff, #8b5cf6);
  transition: width .3s ease;
}

.category-wrap {
  text-align: center;
}

.category {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  background: #252c39;
  color: #b9c2ff;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
  border: 1px solid rgba(185,194,255,0.15);
}

.quiz-layout {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pane-left,
.pane-right {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.pane-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

@media (min-width: 640px) {
  .app {
    max-width: 760px;
  }

  .quiz-layout {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    margin-top: 10px;
  }

  .pane-left {
    flex: 1;
    max-width: 360px;
    margin: 0;
  }

  .pane-right {
    flex: 1;
    max-width: 320px;
    margin: 0;
  }
}

/* 分数表示スタイル */
.fraction {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  padding: 0 4px;
}

.fraction .numerator {
  border-bottom: 3px solid #ffffff;
  padding: 0 8px 3px 8px;
  text-align: center;
  line-height: 1;
}

.fraction .denominator {
  padding: 3px 8px 0 8px;
  text-align: center;
  line-height: 1;
}

.question-container {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 8px 0 16px;
  min-height: 90px;
}

.q-text {
  font-size: clamp(28px, 6.5vw, 44px);
  font-weight: 800;
  letter-spacing: .04em;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.q-text.full-width {
  width: 100%;
  flex-basis: 100%;
}

/* 入力ボックス（標準・分数共通） */
.answer-box {
  min-width: 64px;
  min-height: 54px;
  padding: 4px 12px;
  font-size: clamp(28px, 6.5vw, 42px);
  font-weight: 800;
  text-align: center;
  color: #8096ff;
  background: #10131a;
  border: 2px solid #4a566d;
  border-radius: 14px;
  outline: none;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}

.answer-box.active {
  border-color: #657dff;
  background: #181f33;
  box-shadow: 0 0 12px rgba(101,125,255,0.4), inset 0 2px 6px rgba(0,0,0,0.5);
}

.keypad {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.key {
  min-height: 56px;
  border: 1px solid #394252;
  border-radius: 14px;
  background: #252c37;
  color: #f5f7fb;
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 #151820;
  transition: all .1s ease;
}

.key:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #151820;
}

.key.action {
  background: #303846;
  font-size: 18px;
  color: #d0d7e5;
}

.key.zero {
  grid-column: span 2;
}

.decide {
  display: block;
  width: 100%;
  margin: 12px auto 0;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #657dff, #5b6eff);
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(101,125,255,0.35);
  transition: filter .15s;
}

.decide:hover {
  filter: brightness(1.1);
}

.decide:active {
  transform: translateY(2px);
}

.decide:disabled,
.key:disabled {
  opacity: .4;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.feedback {
  min-height: 48px;
  text-align: center;
  margin-top: 10px;
  font-size: 18px;
  font-weight: 800;
}

.correct {
  color: #5ed6a0;
}

.wrong {
  color: #ff7b7b;
}

.start,
.result {
  text-align: center;
  padding: 10px 0;
}

.start p,
.result p {
  color: #adb5c4;
  line-height: 1.7;
  font-size: 15px;
}

.start button,
.result button {
  display: block;
  width: 100%;
  max-width: 380px;
  margin: 14px auto 0;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  font-size: 19px;
  font-weight: 800;
  cursor: pointer;
  transition: filter .15s;
}

.btn-primary {
  background: linear-gradient(135deg, #657dff, #5b6eff);
  color: #fff;
  box-shadow: 0 4px 15px rgba(101,125,255,0.3);
}

.btn-primary:hover {
  filter: brightness(1.1);
}

.btn-secondary {
  background: #2e3646;
  color: #d0d7e5;
  border: 1px solid #414b5d !important;
}

.btn-secondary:hover {
  background: #384255;
}

.score {
  font-size: 58px;
  font-weight: 900;
  color: #657dff;
  margin: 12px 0;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  backdrop-filter: blur(6px);
}

.modal {
  width: min(460px, 100%);
  background: #1b212c;
  border: 1px solid #414b5d;
  border-radius: 24px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 25px 80px rgba(0,0,0,.6);
  animation: modalIn .22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: scale(.88) translateY(12px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-title {
  font-size: 26px;
  font-weight: 800;
  color: #ff7b7b;
  margin-bottom: 8px;
}

.modal-title.celebrate {
  color: #ffd15c;
}

.modal-question {
  font-size: 22px;
  color: #c0c7d3;
  margin: 12px 0;
  font-weight: 700;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.modal-label {
  font-size: 14px;
  color: #8f99aa;
  margin-top: 12px;
}

.modal-answer {
  font-size: clamp(36px, 10vw, 52px);
  font-weight: 900;
  line-height: 1.2;
  color: #fff;
  margin: 10px 0 20px;
  letter-spacing: .04em;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

.modal-button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #657dff, #5b6eff);
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 4px 15px rgba(101,125,255,0.3);
}

.modal-button.sub {
  background: #2e3646;
  color: #d0d7e5;
  border: 1px solid #414b5d;
  box-shadow: none;
}

@media(max-width:480px) {
  body {
    padding: 10px;
  }

  .app {
    padding: 18px 14px;
    border-radius: 20px;
  }

  .key {
    min-height: 52px;
    font-size: 22px;
  }

  .answer-box {
    min-width: 54px;
    min-height: 48px;
  }

  .modal {
    padding: 24px 18px;
  }

  .menu-button {
    top: 12px;
    left: 12px;
  }
}
</style>

<body>

<!-- ハンバーガーメニュー -->
<button
  id="menu-button"
  class="menu-button"
  aria-label="メニューを開く"
  aria-expanded="false"
  type="button"
>
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- サイドバー -->
<nav id="sidebar" class="sidebar" aria-label="サイトメニュー">
  <div class="sidebar-title">メニュー</div>
  <div class="sidebar-menu">
    <a class="sidebar-link" href="https://hinatabokko-jp.github.io/hinatabokko-app/">
      漢字テスト
    </a>
    <a class="sidebar-link current" href="https://hinatabokko-jp.github.io/hinatabokko-app/page2">
      計算トレーニング
    </a>
    <a class="sidebar-link" href="https://hinatabokko-jp.github.io/hinatabokko-app/page4">
      百人一首
    </a>
  </div>
</nav>

<!-- サイドバーの背景 -->
<div id="menu-overlay" class="menu-overlay"></div>

<!-- メインアプリ -->
<div class="app">
  <div id="screen"></div>
</div>

<script>

let audioCtx = null;

/* ハンバーガーメニューの操作 */
const menuButton = document.getElementById("menu-button");
const sidebar = document.getElementById("sidebar");
const menuOverlay = document.getElementById("menu-overlay");

function toggleMenu() {
  const isOpen = sidebar.classList.toggle("open");
  menuOverlay.classList.toggle("open", isOpen);
  menuButton.classList.toggle("open", isOpen);
  menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
  menuButton.setAttribute("aria-label", isOpen ? "メニューを閉じる" : "メニューを開く");
}

function closeMenu() {
  sidebar.classList.remove("open");
  menuOverlay.classList.remove("open");
  menuButton.classList.remove("open");
  menuButton.setAttribute("aria-expanded", "false");
  menuButton.setAttribute("aria-label", "メニューを開く");
}

menuButton.addEventListener("click", toggleMenu);
menuOverlay.addEventListener("click", closeMenu);

/* オーディオ処理 */
function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playCorrectSound() {
  try {
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const notes = [
      [523.25, 0.00, 0.12, 0.22],
      [659.25, 0.08, 0.12, 0.22],
      [783.99, 0.16, 0.14, 0.25],
      [1046.50, 0.26, 0.50, 0.30],
      [1318.51, 0.26, 0.50, 0.20]
    ];

    notes.forEach(([freq, startOffset, duration, vol]) => {
      const startTime = now + startOffset;
      const stopTime = startTime + duration;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(freq, startTime);
      gain1.gain.setValueAtTime(vol, startTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, stopTime);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(startTime);
      osc1.stop(stopTime);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq, startTime);
      gain2.gain.setValueAtTime(vol * 0.4, startTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, stopTime);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(startTime);
      osc2.stop(stopTime);
    });
  } catch (e) {}
}

const TOTAL = 20;

let questions = [];
let current = 0;
let score = 0;
let answered = false;
let activeBoxIndex = 0;
let userInputs = [];

let keyListener = null;
let modalKeyListener = null;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// 最大公約数
function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}

// 最小公倍数
function lcm(a, b) {
  return (a * b) / gcd(a, b);
}

function makeQuestions() {
  const q = [];

  // 1. 1桁同士の足し算・引き算（2問）
  const b1 = [];
  while (b1.length < 2) {
    const isPlus = Math.random() < 0.5;

    if (isPlus) {
      const a = rand(2, 9);
      const b = rand(2, 9);
      b1.push({
        type: "１桁 ＋ １桁",
        kind: "standard",
        promptHtml: `${a} ＋ ${b} ＝`,
        answers: [a + b],
        answerHtml: `${a + b}`
      });
    } else {
      const a = rand(3, 9);
      const b = rand(2, 9);

      // 引き算の答えが 0 または 1 になる場合は除外
      const diff = a - b;
      if (diff <= 1) continue;

      b1.push({
        type: "１桁 − １桁",
        kind: "standard",
        promptHtml: `${a} − ${b} ＝`,
        answers: [diff],
        answerHtml: `${diff}`
      });
    }
  }
  q.push(...shuffle(b1));

  // 2. 掛け算（5問：1の段を除外するためにrand(2,9)を使用）
  const b2 = [];
  for (let i = 0; i < 5; i++) {
    const a = rand(2, 9);
    const b = rand(2, 9);

    b2.push({
      type: "１桁 × １桁",
      kind: "standard",
      promptHtml: `${a} × ${b} ＝`,
      answers: [a * b],
      answerHtml: `${a * b}`
    });
  }
  q.push(...shuffle(b2));

  // 3. 2桁と1桁の足し算・引き算（5問）
  const b3 = [];
  while (b3.length < 5) {
    const isPlus = Math.random() < 0.5;

    if (isPlus) {
      const a = rand(10, 99);
      const b = rand(2, 9);
      b3.push({
        type: "２桁 ＋ １桁",
        kind: "standard",
        promptHtml: `${a} ＋ ${b} ＝`,
        answers: [a + b],
        answerHtml: `${a + b}`
      });
    } else {
      const a = rand(10, 99);
      const b = rand(2, 9);

      const diff = a - b;
      if (diff === 0 || diff === 1) continue;

      b3.push({
        type: "２桁 − １桁",
        kind: "standard",
        promptHtml: `${a} − ${b} ＝`,
        answers: [diff],
        answerHtml: `${diff}`
      });
    }
  }
  q.push(...shuffle(b3));

  // 4. 2桁同士の足し算・引き算（3問）
  const b4 = [];
  while (b4.length < 3) {
    const isPlus = Math.random() < 0.5;

    if (isPlus) {
      const a = rand(10, 99);
      const b = rand(10, 99);
      b4.push({
        type: "２桁 ＋ ２桁",
        kind: "standard",
        promptHtml: `${a} ＋ ${b} ＝`,
        answers: [a + b],
        answerHtml: `${a + b}`
      });
    } else {
      const a = rand(10, 99);
      const b = rand(10, a);

      const diff = a - b;
      if (diff === 0 || diff === 1) continue;

      b4.push({
        type: "２桁 − ２桁",
        kind: "standard",
        promptHtml: `${a} − ${b} ＝`,
        answers: [diff],
        answerHtml: `${diff}`
      });
    }
  }
  q.push(...shuffle(b4));

  // 5. 約分（2問）
  const b5 = [];
  while (b5.length < 2) {
    const num = rand(1, 6);
    const den = rand(num + 1, 9);
    if (gcd(num, den) !== 1) continue;

    const k = rand(2, 5);
    const origNum = num * k;
    const origDen = den * k;

    if (origDen > 99) continue;
    if (b5.some(item => item.origNum === origNum && item.origDen === origDen)) continue;

    b5.push({
      type: "約分",
      kind: "reduction",
      origNum, origDen,
      answers: [num, den],
      promptHtml: `
        <span class="fraction">
          <span class="numerator">${origNum}</span>
          <span class="denominator">${origDen}</span>
        </span>
        <span style="font-size:32px; margin:0 4px;">＝</span>
      `,
      answerHtml: `
        <span class="fraction">
          <span class="numerator">${num}</span>
          <span class="denominator">${den}</span>
        </span>
      `
    });
  }
  q.push(...shuffle(b5));

  // 6. 通分（共通の分母を求める）（2問）
  const b6 = [];
  while (b6.length < 2) {
    const d1 = rand(2, 8);
    const d2 = rand(2, 8);
    if (d1 === d2) continue;

    const n1 = rand(1, d1 - 1);
    const n2 = rand(1, d2 - 1);

    const commonDen = lcm(d1, d2);
    if (commonDen > 48) continue;

    if (b6.some(item => item.d1 === d1 && item.d2 === d2)) continue;

    b6.push({
      type: "通分（分母）",
      kind: "common_denominator",
      d1, d2, n1, n2,
      answers: [commonDen],
      promptHtml: `
        <span class="fraction">
          <span class="numerator">${n1}</span>
          <span class="denominator">${d1}</span>
        </span>
        <span style="font-size:20px; color:#9da6b6; margin:0 4px;">と</span>
        <span class="fraction">
          <span class="numerator">${n2}</span>
          <span class="denominator">${d2}</span>
        </span>
        <span style="font-size:20px; color:#9da6b6; margin-left:6px;">の通分した分母は？</span>
      `,
      answerHtml: `<span style="font-size:36px; color:#fff;">${commonDen}</span>`
    });
  }
  q.push(...shuffle(b6));

  // 7. 通分（通分後の分子を答える）（1問）
  const b7 = [];
  while (b7.length < 1) {
    const d1 = rand(2, 6);
    const d2 = rand(2, 6);
    if (d1 === d2) continue;

    const n1 = rand(1, d1 - 1);
    const n2 = rand(1, d2 - 1);

    const commonDen = lcm(d1, d2);
    const ans1 = n1 * (commonDen / d1);
    const ans2 = n2 * (commonDen / d2);

    b7.push({
      type: "通分（分子）",
      kind: "common_numerators",
      d1, d2, n1, n2, commonDen,
      answers: [ans1, ans2],
      promptHtml: `
        <span class="fraction">
          <span class="numerator">${n1}</span>
          <span class="denominator">${d1}</span>
        </span>
        <span style="font-size:20px; color:#9da6b6; margin:0 2px;">と</span>
        <span class="fraction">
          <span class="numerator">${n2}</span>
          <span class="denominator">${d2}</span>
        </span>
        <span style="font-size:28px; color:#8096ff; margin:0 6px;">➔</span>
      `,
      answerHtml: `
        <span class="fraction">
          <span class="numerator">${ans1}</span>
          <span class="denominator">${commonDen}</span>
        </span>
        <span style="font-size:20px; color:#9da6b6; margin:0 4px;">と</span>
        <span class="fraction">
          <span class="numerator">${ans2}</span>
          <span class="denominator">${commonDen}</span>
        </span>
      `
    });
  }
  q.push(...b7);

  return q;
}


/* スタート画面 */
function showStart() {
  removeKeyListener();

  document.getElementById("screen").innerHTML = `
    <div class="start">
      <h1>計算トレーニング</h1>
      <div class="subtitle">
        全部で ${TOTAL} 問に挑戦！
      </div>
      <p>
        段階的に難易度が上がります：<br>
        1. 1桁の足し算・引き算 (2問)<br>
        2. 掛け算 (5問)<br>
        3. 2桁と1桁の計算 (5問)<br>
        4. 2桁同士の計算 (3問)<br>
        5. 約分 (2問)<br>
        6. 通分（共通の分母） (2問)<br>
        7. 通分（通分後の分子） (1問)
      </p>
      <button id="btn-start" class="btn-primary">
        スタート
      </button>
    </div>
  `;

  document.getElementById("btn-start").addEventListener("click", () => {
    initAudio();
    startGame();
  });
}

/* ゲーム開始 */
function startGame() {
  questions = makeQuestions();
  current = 0;
  score = 0;
  answered = false;
  renderQuestion();
}

/* キーボードイベント解除 */
function removeKeyListener() {
  if (keyListener) {
    window.removeEventListener("keydown", keyListener);
    keyListener = null;
  }
  if (modalKeyListener) {
    window.removeEventListener("keydown", modalKeyListener);
    modalKeyListener = null;
  }
}

/* 問題表示 */
function renderQuestion() {
  removeKeyListener();

  const q = questions[current];
  activeBoxIndex = 0;
  userInputs = new Array(q.answers.length).fill("");

  const qTextClass = (q.kind === "common_numerators") ? "q-text full-width" : "q-text";

  let inputHtml = "";
  if (q.kind === "standard") {
    inputHtml = `<div id="box-0" class="answer-box active" data-index="0" style="min-width:100px;"></div>`;
  } else if (q.kind === "reduction") {
    inputHtml = `
      <div class="fraction">
        <div class="numerator">
          <div id="box-0" class="answer-box active" data-index="0"></div>
        </div>
        <div class="denominator">
          <div id="box-1" class="answer-box" data-index="1"></div>
        </div>
      </div>
    `;
  } else if (q.kind === "common_denominator") {
    inputHtml = `
      <div id="box-0" class="answer-box active" data-index="0" style="min-width:90px;"></div>
    `;
  } else if (q.kind === "common_numerators") {
    inputHtml = `
      <div class="fraction">
        <div class="numerator">
          <div id="box-0" class="answer-box active" data-index="0"></div>
        </div>
        <div class="denominator" style="color:#aeb7c6; font-size:28px;">
          ${q.commonDen}
        </div>
      </div>
      <span style="font-size:20px; color:#9da6b6; margin:0 2px;">と</span>
      <div class="fraction">
        <div class="numerator">
          <div id="box-1" class="answer-box" data-index="1"></div>
        </div>
        <div class="denominator" style="color:#aeb7c6; font-size:28px;">
          ${q.commonDen}
        </div>
      </div>
    `;
  }

  document.getElementById("screen").innerHTML = `
    <h1>計算トレーニング</h1>
    <div class="quiz-layout">
      <div class="pane-left">
        <div class="progress-wrap">
          <div class="progress-info">
            <span>第 ${current + 1} 問 / ${TOTAL} 問</span>
            <span>正解 ${score} 問</span>
          </div>
          <div class="bar">
            <span style="width:${(current / TOTAL) * 100}%"></span>
          </div>
        </div>

        <div class="category-wrap">
          <span class="category">${q.type}</span>
        </div>

        <div class="question-container">
          <span class="${qTextClass}">${q.promptHtml}</span>
          ${inputHtml}
        </div>

        <div id="feedback" class="feedback"></div>
      </div>

      <div class="pane-right">
        <div class="keypad" id="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>

          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>

          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>

          <button class="key action zero" data-key="0">0</button>
          <button class="key action" data-key="back">⌫</button>
        </div>

        <button class="decide" id="submit">決定</button>
      </div>
    </div>
  `;

  const boxes = document.querySelectorAll(".answer-box");
  boxes.forEach(box => {
    box.addEventListener("click", () => {
      if (answered) return;
      initAudio();
      activeBoxIndex = parseInt(box.dataset.index, 10);
      updateBoxHighlights();
    });
  });

  const keys = document.querySelectorAll(".key");
  const btn = document.getElementById("submit");

  const updateBoxHighlights = () => {
    boxes.forEach((b, idx) => {
      b.classList.toggle("active", idx === activeBoxIndex);
    });
  };

  const inputKey = k => {
    initAudio();
    if (answered) return;

    let currentVal = userInputs[activeBoxIndex];

    if (k === "back") {
      if (currentVal.length > 0) {
        userInputs[activeBoxIndex] = currentVal.slice(0, -1);
      } else if (activeBoxIndex > 0) {
        activeBoxIndex--;
        updateBoxHighlights();
      }
    } else {
      if (currentVal.length >= 4) return;
      userInputs[activeBoxIndex] += k;

      // 複数入力がある場合、目標桁数に達したら自動で次の枠へ
      if (userInputs.length > 1 && activeBoxIndex === 0) {
        const expectedLen = String(q.answers[0]).length;
        if (userInputs[0].length >= expectedLen) {
          activeBoxIndex = 1;
        }
      }
    }

    boxes.forEach((b, idx) => {
      b.textContent = userInputs[idx];
    });
    updateBoxHighlights();
  };

  keys.forEach(key => {
    key.addEventListener("click", () => {
      inputKey(key.dataset.key);
    });
  });

  keyListener = e => {
    if (answered) return;

    if (e.key >= "0" && e.key <= "9") {
      inputKey(e.key);
    } else if (e.key === "Backspace") {
      inputKey("back");
    } else if (e.key === "Enter") {
      checkAnswer(keys, btn);
    } else if (e.key === "Tab") {
      e.preventDefault();
      if (userInputs.length > 1) {
        activeBoxIndex = (activeBoxIndex + 1) % userInputs.length;
        updateBoxHighlights();
      }
    }
  };

  window.addEventListener("keydown", keyListener);

  btn.addEventListener("click", () => {
    initAudio();
    checkAnswer(keys, btn);
  });
}


/* 正解時の紙吹雪 */
function celebrate(isLarge = false) {
  if (typeof confetti === "function") {
    try {
      const count = isLarge ? 160 : 100;
      confetti({
        particleCount: count,
        spread: 80,
        startVelocity: 35,
        origin: { y: .65 }
      });

      setTimeout(() => {
        confetti({
          particleCount: Math.round(count * 0.7),
          spread: 120,
          startVelocity: 28,
          origin: { x: .15, y: .7 }
        });
      }, 120);

      setTimeout(() => {
        confetti({
          particleCount: Math.round(count * 0.7),
          spread: 120,
          startVelocity: 28,
          origin: { x: .85, y: .7 }
        });
      }, 220);
    } catch(e) {}
  }
}

/* 答え合わせ */
function checkAnswer(keys, btn) {
  if (answered) return;

  const feedback = document.getElementById("feedback");

  const hasEmpty = userInputs.some(val => val === "");
  if (hasEmpty) {
    feedback.innerHTML = "答えを入力してください。";
    feedback.className = "feedback wrong";
    return;
  }

  answered = true;
  keys.forEach(k => k.disabled = true);
  btn.disabled = true;

  const q = questions[current];
  const isCorrect = userInputs.every((val, idx) => Number(val) === q.answers[idx]);

  if (isCorrect) {
    score++;
    feedback.innerHTML = "🎉 正解！すごい！";
    feedback.className = "feedback correct";

    playCorrectSound();
    celebrate(false);

    setTimeout(nextQuestion, 1300);
  } else {
    feedback.innerHTML = "不正解";
    feedback.className = "feedback wrong";
    showWrongModal();
  }
}


/* 不正解モーダル */
function showWrongModal() {
  removeKeyListener();

  const q = questions[current];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title">❌ 不正解</div>
      <div class="modal-question">${q.promptHtml}</div>
      <div class="modal-label">正しい答え</div>
      <div class="modal-answer">${q.answerHtml}</div>
      <button class="modal-button" id="modal-next">次の問題へ (Enter)</button>
    </div>
  `;

  document.body.appendChild(overlay);

  const closeModal = () => {
    removeKeyListener();
    overlay.remove();
    nextQuestion();
  };

  const nextBtn = overlay.querySelector("#modal-next");
  nextBtn.addEventListener("click", closeModal);

  modalKeyListener = e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      closeModal();
    }
  };

  window.addEventListener("keydown", modalKeyListener);

  try {
    nextBtn.focus();
  } catch(e) {}
}

/* 完走モーダル */
function showCompletionModal() {
  removeKeyListener();

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title celebrate">🎉 がんばったね！</div>
      <div style="font-size:22px; font-weight:800; color:#f2f4f8; margin:14px 0 8px;">
        おつかれさまでした！
      </div>
      <div style="color:#adb5c4; font-size:15px; line-height:1.6; margin-bottom:20px;">
        全 ${TOTAL} 問のトレーニングを完走しました！<br>
        最終結果:
        <strong style="color:#657dff; font-size:24px;">
          ${score} / ${TOTAL}
        </strong>
        問正解
      </div>
      <button class="modal-button" id="modal-result-btn">結果を見る (Enter)</button>
    </div>
  `;

  document.body.appendChild(overlay);

  playCorrectSound();
  celebrate(true);

  const resultBtn = overlay.querySelector("#modal-result-btn");

  const closeModal = () => {
    removeKeyListener();
    overlay.remove();
    showResult();
  };

  resultBtn.addEventListener("click", closeModal);

  modalKeyListener = e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      closeModal();
    }
  };

  window.addEventListener("keydown", modalKeyListener);

  try {
    resultBtn.focus();
  } catch(e) {}
}

/* 次の問題へ */
function nextQuestion() {
  current++;
  if (current >= TOTAL) {
    showCompletionModal();
  } else {
    answered = false;
    renderQuestion();
  }
}

/* 結果画面 */
function showResult() {
  removeKeyListener();

  const totalPlayed = Math.min(current, TOTAL);
  const percent = Math.round((score / totalPlayed) * 100);

  const message =
    percent === 100
      ? "🏆 パーフェクト！すばらしい！"
      : percent >= 80
      ? "🌟 よくできました！すごい！"
      : percent >= 60
      ? "👏 がんばったね！"
      : "💪 もう一度チャレンジしてみよう！";

  document.getElementById("screen").innerHTML = `
    <div class="result">
      <h1>トレーニング終了！</h1>
      <div class="score">${score} / ${totalPlayed}</div>
      <div class="subtitle">正解率 ${percent}%</div>
      <p>${message}</p>
      <button id="btn-restart" class="btn-primary">もう一度挑戦</button>
      <button id="btn-end" class="btn-secondary">最初にもどる</button>
    </div>
  `;

  document.getElementById("btn-restart").addEventListener("click", () => {
    initAudio();
    startGame();
  });

  document.getElementById("btn-end").addEventListener("click", () => {
    initAudio();
    showStart();
  });

  if (score === totalPlayed && totalPlayed > 0) {
    playCorrectSound();
    celebrate(true);
  }
}

/* 初期表示 */
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", showStart);
} else {
  showStart();
}
</script>
