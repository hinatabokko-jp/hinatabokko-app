<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル電卓</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* スクロールバーの非表示（念のための予備設定） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-2 font-sans select-none">

  <!-- 電卓本体コンテナ -->
  <div class="relative w-full max-w-xs bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col">
    
    <!-- ヘッダーエリア -->
    <div class="flex items-center justify-between px-5 pt-4 pb-1 text-slate-400">
      <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">電卓</span>
      <button
        id="history-btn"
        onclick="toggleHistory()"
        class="p-2 rounded-full transition-colors hover:bg-slate-800 text-slate-400"
        title="計算履歴"
      >
        <!-- 履歴アイコン (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      </button>
    </div>

    <!-- ディスプレイエリア（スクロールバー非表示） -->
    <div class="px-5 py-3 flex flex-col justify-end items-end h-32 bg-slate-900/60 border-b border-slate-800/50">
      <div id="expression-display" class="text-xs text-slate-400 min-h-[1.25rem] font-mono tracking-wide overflow-hidden max-w-full text-right"></div>
      <div id="main-display" class="text-4xl font-light text-slate-50 tracking-tight font-mono overflow-hidden max-w-full text-right mt-1">0</div>
    </div>

    <!-- ボタン グリッドエリア -->
    <div class="p-3 grid grid-cols-4 gap-2.5 bg-slate-900">
      <!-- 1段目: 機能ボタン -->
      <button onclick="clearAll()" class="h-14 rounded-2xl bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 active:scale-95 transition-all text-lg font-medium">AC</button>
      <button onclick="toggleSign()" class="h-14 rounded-2xl bg-slate-800 text-slate-300 hover:bg-slate-700 active:scale-95 transition-all text-lg font-medium">±</button>
      <button onclick="inputPercent()" class="h-14 rounded-2xl bg-slate-800 text-slate-300 hover:bg-slate-700 active:scale-95 transition-all text-lg font-medium">%</button>
      <button id="op-divide" onclick="performOperation('/')" class="op-btn h-14 rounded-2xl bg-amber-500 text-slate-950 hover:bg-amber-400 active:scale-95 transition-all text-xl font-medium">÷</button>

      <!-- 2段目: 7, 8, 9, × -->
      <button onclick="inputDigit(7)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">7</button>
      <button onclick="inputDigit(8)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">8</button>
      <button onclick="inputDigit(9)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">9</button>
      <button id="op-multiply" onclick="performOperation('*')" class="op-btn h-14 rounded-2xl bg-amber-500 text-slate-950 hover:bg-amber-400 active:scale-95 transition-all text-xl font-medium">×</button>

      <!-- 3段目: 4, 5, 6, − -->
      <button onclick="inputDigit(4)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">4</button>
      <button onclick="inputDigit(5)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">5</button>
      <button onclick="inputDigit(6)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">6</button>
      <button id="op-subtract" onclick="performOperation('-')" class="op-btn h-14 rounded-2xl bg-amber-500 text-slate-950 hover:bg-amber-400 active:scale-95 transition-all text-xl font-medium">−</button>

      <!-- 4段目: 1, 2, 3, ＋ -->
      <button onclick="inputDigit(1)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">1</button>
      <button onclick="inputDigit(2)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">2</button>
      <button onclick="inputDigit(3)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">3</button>
      <button id="op-add" onclick="performOperation('+')" class="op-btn h-14 rounded-2xl bg-amber-500 text-slate-950 hover:bg-amber-400 active:scale-95 transition-all text-xl font-medium">＋</button>

      <!-- 5段目: 0, 1文字削除(BS), ., ＝ -->
      <button onclick="inputDigit(0)" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">0</button>
      <button onclick="backspace()" class="h-14 rounded-2xl bg-slate-800/80 text-slate-300 hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center" title="一文字削除">
        <!-- Backspace アイコン (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>
      </button>
      <button onclick="inputDecimal()" class="h-14 rounded-2xl bg-slate-800/80 text-slate-100 hover:bg-slate-700 active:scale-95 transition-all text-xl font-medium">.</button>
      <button onclick="handleEquals()" class="h-14 rounded-2xl bg-emerald-500 text-slate-950 hover:bg-emerald-400 active:scale-95 transition-all text-xl font-semibold shadow-lg shadow-emerald-950/20">＝</button>
    </div>

    <!-- 履歴オーバーレイパネル -->
    <div id="history-panel" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-sm z-10 flex-col p-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
        <h3 class="text-sm font-medium text-slate-200 flex items-center gap-2">
          <svg class="text-amber-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          計算履歴
        </h3>
        <button onclick="toggleHistory()" class="text-slate-400 hover:text-slate-100 text-xs font-medium px-2 py-1 rounded bg-slate-800">閉じる</button>
      </div>

      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1 no-scrollbar">
        <!-- 履歴データがここに動的生成されます -->
      </div>

      <button id="clear-history-btn" onclick="clearHistory()" class="mt-3 py-2 w-full text-xs text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 rounded-xl transition-colors font-medium hidden">
        履歴を消去
      </button>
    </div>

  </div>

  <script>
    // 内部状態変数
    let displayValue = '0';
    let firstOperand = null;
    let operator = null;
    let waitingForSecondOperand = false;
    let expression = '';
    let history = [];

    // DOM要素
    const mainDisplay = document.getElementById('main-display');
    const expressionDisplay = document.getElementById('expression-display');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    // 画面表示更新
    function updateDisplay() {
      mainDisplay.textContent = displayValue;
      expressionDisplay.textContent = expression;
    }

    // 数字入力
    function inputDigit(digit) {
      if (waitingForSecondOperand) {
        displayValue = String(digit);
        waitingForSecondOperand = false;
      } else {
        displayValue = displayValue === '0' ? String(digit) : displayValue + digit;
      }
      updateDisplay();
    }

    // 小数点入力
    function inputDecimal() {
      if (waitingForSecondOperand) {
        displayValue = '0.';
        waitingForSecondOperand = false;
        updateDisplay();
        return;
      }
      if (!displayValue.includes('.')) {
        displayValue += '.';
        updateDisplay();
      }
    }

    // 全クリア（AC）
    function clearAll() {
      displayValue = '0';
      firstOperand = null;
      operator = null;
      waitingForSecondOperand = false;
      expression = '';
      updateDisplay();
    }

    // 1文字削除
    function backspace() {
      if (waitingForSecondOperand) return;
      if (displayValue.length === 1 || (displayValue.length === 2 && displayValue.startsWith('-'))) {
        displayValue = '0';
      } else {
        displayValue = displayValue.slice(0, -1);
      }
      updateDisplay();
    }

    // 符号反転
    function toggleSign() {
      const val = parseFloat(displayValue);
      displayValue = String(val * -1);
      updateDisplay();
    }

    // パーセント
    function inputPercent() {
      const val = parseFloat(displayValue);
      if (val === 0) return;
      displayValue = String(val / 100);
      updateDisplay();
    }

    // 演算子変更・計算実行
    function performOperation(nextOperator) {
      const inputValue = parseFloat(displayValue);

      if (firstOperand === null) {
        firstOperand = inputValue;
      } else if (operator) {
        const result = calculate(firstOperand, inputValue, operator);
        const formatted = Number(result.toFixed(8)).toString();
        
        // 履歴追加
        addHistory(`${firstOperand} ${getOperatorSymbol(operator)} ${inputValue}`, formatted);

        displayValue = formatted;
        firstOperand = result;
      }

      waitingForSecondOperand = true;
      operator = nextOperator;
      expression = `${inputValue} ${getOperatorSymbol(nextOperator)}`;
      updateDisplay();
    }

    // イコール（＝）
    function handleEquals() {
      const inputValue = parseFloat(displayValue);

      if (operator && firstOperand !== null) {
        const result = calculate(firstOperand, inputValue, operator);
        const formatted = Number(result.toFixed(8)).toString();
        const exprString = `${firstOperand} ${getOperatorSymbol(operator)} ${inputValue}`;

        expression = `${exprString} =`;
        displayValue = formatted;

        addHistory(exprString, formatted);

        firstOperand = null;
        operator = null;
        waitingForSecondOperand = true;
        updateDisplay();
      }
    }

    // 計算実行コア関数
    function calculate(first, second, op) {
      switch (op) {
        case '+': return first + second;
        case '-': return first - second;
        case '*': return first * second;
        case '/': return second !== 0 ? first / second : 0;
        default: return second;
      }
    }

    // 記号変換
    function getOperatorSymbol(op) {
      switch (op) {
        case '+': return '＋';
        case '-': return '−';
        case '*': return '×';
        case '/': return '÷';
        default: return '';
      }
    }

    // 履歴パネル開閉
    function toggleHistory() {
      const isHidden = historyPanel.classList.contains('hidden');
      if (isHidden) {
        historyPanel.classList.remove('hidden');
        historyPanel.classList.add('flex');
        renderHistory();
      } else {
        historyPanel.classList.add('hidden');
        historyPanel.classList.remove('flex');
      }
    }

    // 履歴追加
    function addHistory(expr, res) {
      history.unshift({ expr, res });
      if (history.length > 20) history.pop();
    }

    // 履歴リスト描画
    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<div class="text-center text-slate-500 py-10 text-xs">履歴はありません</div>';
        clearHistoryBtn.classList.add('hidden');
        return;
      }

      clearHistoryBtn.classList.remove('hidden');
      history.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'p-2.5 bg-slate-800/60 rounded-xl hover:bg-slate-800 cursor-pointer transition-colors text-right';
        div.onclick = () => {
          displayValue = item.res;
          updateDisplay();
          toggleHistory();
        };
        div.innerHTML = `
          <div class="text-[10px] text-slate-400 font-mono">${item.expr} =</div>
          <div class="text-lg font-light text-slate-100 font-mono mt-0.5">${item.res}</div>
        `;
        historyList.appendChild(div);
      });
    }

    // 履歴消去
    function clearHistory() {
      history = [];
      renderHistory();
    }

    // キーボード入力サポート
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputDigit(parseInt(e.key, 10));
      else if (e.key === '.') inputDecimal();
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); handleEquals(); }
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === '+') performOperation('+');
      else if (e.key === '-') performOperation('-');
      else if (e.key === '*') performOperation('*');
      else if (e.key === '/') { e.preventDefault(); performOperation('/'); }
    });
  </script>
</body>
</html>
